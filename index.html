<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AppEXAM</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--btn:#3b6bc8;--btnink:#fff;--bg:#eef3fa;--card:#fff;--ink:#14233b;--mute:#5d6b82;--line:#d3dcea;--blue:#3b6bc8;--sky:#4fc3ee;--chip:#f3f6fb;
--ok:#1f9d55;--mb:#5fb36a;--b:#d9b429;--r:#e48a1c;--no:#d64545;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1826;--card:#172336;--ink:#e8eef8;--mute:#9aa9c0;--line:#2a3a54;--chip:#1e2d45;--blue:#6d97ee}}
:root[data-theme="dark"]{--bg:#0f1826;--card:#172336;--ink:#e8eef8;--mute:#9aa9c0;--line:#2a3a54;--chip:#1e2d45;--blue:#6d97ee}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1,h2{font-family:"Barlow Semi Condensed",Barlow,sans-serif;margin:0}
header .brand{position:relative;display:inline-block;line-height:0}header{justify-content:center!important;position:relative}header .btns{position:absolute;right:0;top:0}@media (max-width:700px){header .btns{position:static}}
header .logo{mix-blend-mode:multiply;height:110px;width:auto;max-width:70vw;display:block}header .brand h1{position:absolute;left:46.6%;top:32%;margin:0;color:#60cff0;font-family:Montserrat,'Segoe UI',Arial,sans-serif;font-weight:600;font-size:17px;line-height:1;letter-spacing:.14em;white-space:nowrap}
header{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:26px;line-height:1.1}
h1 small{display:block;font:500 15px Barlow,sans-serif;color:var(--mute);margin-top:4px}
.btns{display:flex;gap:8px}
.btn{font:600 14px Barlow,sans-serif;border:1px solid var(--btn);background:var(--btn);color:var(--btnink);padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.sec{background:transparent;color:var(--blue);border-color:var(--blue)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.id{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sky);border-radius:10px;padding:14px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mute);font-weight:500}
input,textarea{width:100%;font:16px Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:3px}
textarea{min-height:70px;resize:vertical}
.sec-card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.sec-h{background:var(--blue);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sec-h h2{font-size:19px;color:#fff}
.sec-h .btn.sec{color:#fff;border-color:#fff;padding:6px 10px;font-size:13px}
.tabs{display:flex;gap:6px}
.tab{font:600 14px Barlow,sans-serif;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.tab[aria-selected=true],.tab[aria-pressed=true]{background:var(--card);color:#2a56a8}
.pane{display:none;padding:14px}
.pane.on{display:block}
.top{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
.top .n{width:110px}
.sug{background:var(--no);color:#fff;font:600 14px Barlow,sans-serif;padding:7px 12px;border-radius:8px}
.prog{font-size:13px;color:var(--mute);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.crit{border:1px solid var(--line);border-radius:8px;padding:10px}
.crit h3{font:700 15px "Barlow Semi Condensed",sans-serif;margin:0 0 6px;color:var(--blue)}
.grp{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px}
.grp:last-child{margin-bottom:0}
.crit.cbl{display:flex;flex-direction:column}
.crit.cbl .grp.nbl{margin-top:auto;border-top:0;padding-top:10px;margin-bottom:0;justify-content:flex-start}
.crit .grp+.grp{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.grp>.gl{padding-left:0}
.grp.lr{justify-content:space-between}
.cst{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;margin:0 6px 6px 0;vertical-align:top}.cs{font:600 11px/1.2 Inter,sans-serif;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--mute)}.cs.a{background:#e3f4e8;border-color:#9fd3ae;color:#1d6b3a}.cs.p{background:#fff3d6;border-color:#e6c776;color:#8a5a00}
.crit .grp{justify-content:space-between}
.crit.lrc{display:flex;flex-direction:column}
.crit.lrc .grp.lrb{margin-top:auto;border-top:0;padding-top:10px;margin-bottom:0;justify-content:space-between}
.crit.lrc .grp:not(.lrb):nth-last-child(2){margin-bottom:0}
.grp>.gl:not(.gt){font-size:14px;font-weight:500;color:var(--mute)}
.crit .grp+.grp .gl.gt{margin:0 0 -1px}
.gl{font-size:12px;color:var(--mute);width:100%}
.gl.gt{font:700 15px "Barlow Semi Condensed",sans-serif;color:var(--blue)}
.chip{font:500 14px Barlow,sans-serif;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;min-height:32px}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.rt[aria-pressed=true]{color:#fff}
.chip.nrj[aria-pressed=true],.chip.rt.nrj[aria-pressed=true]{background:#d64545;border-color:#d64545;color:#fff}
.grp .br{flex-basis:100%;height:0}
.chip.ency[aria-pressed=true]{background:var(--r);border-color:var(--r);color:#fff}
.chip.nrj[aria-pressed=true]:disabled{opacity:1;cursor:default}
.chip.OK[aria-pressed=true],.chip.EXC[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
.chip.MB[aria-pressed=true]{background:var(--mb);border-color:var(--mb)}
.chip.B[aria-pressed=true]{background:var(--b);border-color:var(--b);color:#2b2300}
.chip.R[aria-pressed=true]{background:var(--r);border-color:var(--r)}
.chip.NO[aria-pressed=true]{background:var(--no);border-color:var(--no)}
.pd{margin-top:12px;border:1px solid var(--line);border-left:5px solid var(--mute);border-radius:8px;padding:10px 12px}
.pd h3{font:700 15px "Barlow Semi Condensed",sans-serif;margin:0 0 6px}
.pd ul{margin:0;padding-left:18px;font-size:14px;color:var(--mute)}
.pd li.a{color:var(--no);font-weight:600}
.ch{font:700 15px "Barlow Semi Condensed",sans-serif;margin:0}
.auto{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0 10px;font-size:14px}
.auto ul{margin:0 0 6px;padding-left:18px}
.auto p{margin:4px 0}
.bh{font-weight:600;color:var(--blue)}
.empty{color:var(--mute)}
.crit.off{opacity:.65}
.chip:disabled{cursor:not-allowed;opacity:.4}
.invmsg{margin:0 0 10px;padding:8px 12px;border-radius:8px;border:1px solid var(--no);color:var(--no);font-weight:600;font-size:14px}
.microw{display:flex;gap:10px;align-items:center;margin-top:8px}
.micmsg{font-size:13px;color:var(--mute)}
.btn.mic[aria-pressed=true]{background:var(--no);border-color:var(--no);color:#fff}
.dv{margin:0 0 10px}
.dv:empty{display:none}
.dv.on{padding:8px 12px;border:1px dashed var(--blue);border-radius:8px}
.dvm{margin:0 0 6px;font-size:14px}
.dvs{margin:0 0 6px;font-size:13px;color:var(--mute)}
.dv .btn{margin-right:6px}
.vtabs{display:flex;gap:6px;margin-bottom:12px}
.vt{font:600 15px Barlow,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:8px;cursor:pointer}
.vt[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.bar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.bar label{flex:1;min-width:200px}
select{width:100%;font:16px Barlow,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:3px}
[hidden]{display:none!important}
.fin{background:var(--card);color:#2a56a8;font:700 14px Barlow,sans-serif;padding:4px 10px;border-radius:999px}
.okc{color:var(--ok);font-weight:600;font-size:14px;align-self:center}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:center;font-size:15px}
th{background:var(--blue);color:#fff;font-weight:600}
td.l{text-align:left}.pend{color:var(--mute)}.nim{color:var(--no)}
.lnk{background:none;border:0;color:var(--blue);font:600 15px Barlow,sans-serif;cursor:pointer;text-decoration:underline;padding:0}
.nt{font-size:20px;margin:0 0 6px}
.gh{font:700 17px "Barlow Semi Condensed",sans-serif;margin:4px 0 8px;color:var(--ink)}.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:14px}.dgrid .gx{margin-bottom:0}
details[data-dtg=usr] .xls th:nth-child(3),details[data-dtg=usr] .xls td:nth-child(3){width:1%;text-align:center}
.xls select{width:auto;font:14px Calibri,Carlito,"Segoe UI",Arial,sans-serif;padding:2px 4px;margin:0;border-radius:4px}
.xls{border-collapse:collapse;width:100%;font:14px Calibri,Carlito,"Segoe UI",Arial,sans-serif;background:var(--card);border:1px solid var(--line)}.xls th,.xls td{border:1px solid var(--line);padding:4px 10px;text-align:left;white-space:nowrap}.xls thead th{background:var(--chip);color:var(--mute);font-weight:600;text-align:center;font-size:12px;position:sticky;top:0}.xls thead tr.xh th{background:var(--chip);color:var(--ink);font-weight:700;text-align:left;font-size:14px}.xls td.rn,.xls th.rn{background:var(--chip);color:var(--mute);text-align:center;width:44px;font-size:12px;font-weight:600}.xls tbody tr:hover td:not(.rn){background:rgba(59,107,200,.10)}.xls td.ac{text-align:center;width:1%}.xlsw{overflow:auto;max-height:460px;border-radius:4px}
.xdet{margin:6px 0}.xdet>summary{cursor:pointer;font-weight:700;color:var(--blue);padding:6px 0}
.ncom td{background:var(--chip);padding:10px 14px}.ncm{margin:0 0 10px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;text-align:left}.ncm h4{margin:0 0 4px;font:700 15px "Barlow Semi Condensed",sans-serif;color:var(--blue)}.ncm p{margin:4px 0;font-size:14px}
.dgrid details{min-width:0}.dgrid .nvd{margin:8px 0}.dgrid .nvm{font:700 11px Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}.dgrid .nvm:first-child{border-top:0;margin-top:0;padding-top:0}.dgrid .nvd>summary{list-style:none;display:block;text-align:center;background:var(--btn);color:var(--btnink);font:700 15px Barlow,sans-serif;padding:9px 14px;border-radius:8px;cursor:pointer;margin-bottom:8px}.dgrid .nvd>summary::-webkit-details-marker{display:none}.dgrid .nvd>summary::after{content:' ▾';font-size:12px}.dgrid .nvd[open]>summary::after{content:' ▴'}.dgrid .nvd>summary:hover{filter:brightness(1.1)}.dgrid .gtab{box-sizing:border-box;min-width:0}.dgrid .gtabs{display:grid;grid-template-columns:minmax(0,1fr);overflow:visible;white-space:normal;gap:6px;border-bottom:0;margin-bottom:10px}.dgrid .gtab{width:100%;text-align:center}.dgrid .gtab{margin-bottom:0;border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:14px}#welc{position:fixed;inset:0;z-index:110;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}.welcbox{background:var(--card);color:var(--ink);border-radius:14px;max-width:480px;width:100%;max-height:100%;overflow:auto;padding:22px 20px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;box-sizing:border-box}.welcbox h2{margin:0;font-size:22px;color:var(--blue)}.welcbox p{margin:0}.welcb{display:flex;flex-direction:column;gap:8px}#tutov{position:fixed;inset:0;z-index:100;background:var(--bg,#fff);overflow:auto;-webkit-overflow-scrolling:touch}.tutbar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--card,#fff);border-bottom:1px solid var(--line);z-index:1}.tutdoc{max-width:780px;margin:0 auto;padding:16px 16px 60px;line-height:1.55;font-size:15px}.tutdoc h2{font-size:24px;margin:.4em 0}.tutdoc h3{font-size:19px;margin:1.6em 0 .4em;color:var(--blue)}.tutdoc h4{font-size:16px;margin:1.2em 0 .3em}.tutdoc ul,.tutdoc ol{padding-left:22px}.tutdoc li{margin:3px 0}.tutdoc code{background:var(--chip);padding:1px 5px;border-radius:4px}.tutb{display:flex;gap:8px;flex-wrap:wrap}.tutb .btn:disabled{opacity:.5;cursor:not-allowed}.tutb .btn{flex:1 1 200px;text-align:center;text-decoration:none;box-sizing:border-box}
.gxs>.btn{display:block;width:100%;margin:0 0 6px;text-align:center}.dgrid .gtab.on{border:1px solid var(--blue)}.dgrid .gtabs.nvg{margin-bottom:8px}.dgrid .gtabs.nvg .gtab{background:#c9d8f3;border-color:#aebfe6}.dgrid .gtabs.nvg .gtab:hover:not(:disabled){background:#b9cdef;border-color:var(--blue)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dgrid .gtabs.nvg .gtab{background:#24406e;border-color:#35558c}:root:not([data-theme="light"]) .dgrid .gtabs.nvg .gtab:hover:not(:disabled){background:#2d4d82}}:root[data-theme="dark"] .dgrid .gtabs.nvg .gtab{background:#24406e;border-color:#35558c}:root[data-theme="dark"] .dgrid .gtabs.nvg .gtab:hover:not(:disabled){background:#2d4d82}.dgrid .gtab:disabled{opacity:.5;cursor:default}.gtab .nvl{display:block;font-weight:700}.gtab .nvt{display:block;font-weight:400;color:var(--mut);font-size:12px}.gtab .cs{display:block;margin-top:2px}.dgrid .gtabs.hs .gtab:not(.on){opacity:.45}.dgrid .gtabs.hs .gtab:not(.on):hover{opacity:.85}
.gtabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin:0 0 14px;overflow-x:auto;white-space:nowrap}.gtab{font:600 15px Barlow,sans-serif;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;padding:9px 18px;cursor:pointer;margin-bottom:-2px;flex:0 0 auto}.gtab:hover{background:var(--line)}.gtab.on{background:var(--card);color:var(--blue);border-bottom:2px solid var(--card);font-weight:700}
.gx{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.gx h3{font:700 16px "Barlow Semi Condensed",sans-serif;margin:0 0 8px;color:var(--blue)}
.chk{display:inline-flex;gap:6px;align-items:center;margin-right:16px;font-size:15px;color:var(--ink)}
.chk input{width:auto;margin:0}
.vt[hidden]{display:none}
.jf{font:500 13px Barlow,sans-serif;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;margin:0 6px}
.jf[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.gl{margin:8px 0 0;padding-left:18px}.gl li{margin-bottom:4px}
.of td input{width:84px;margin:0;text-align:center}
.of td.dvs{font-size:12px;text-align:left;vertical-align:top;min-width:150px}
.of td b{font-size:18px}
.opt{display:flex;margin:6px 0;align-items:flex-start}.opt input{margin-top:4px}.tg{margin-bottom:10px}.tg>b{display:block;color:var(--ink)}
.com{padding:0 14px 14px}
@media print{body{background:#fff}.btns,.tabs,.microw,.dv,.vtabs,.bar{display:none}.pane{display:block!important;break-inside:avoid}.sec-card{break-inside:avoid}.wrap{padding:0}}

const TUT_MD={"g": "# Tutorial de uso general\n\nGuía paso a paso para usar AppEXAM como examinador: crear tu acceso, entrar a tu examen, completar las planillas, ver las notas finales, trabajar con la planilla oficial y firmarla.\n\n## 1. Qué es AppEXAM y quién la usa\n\nAppEXAM es la planilla digital de los exámenes de AADIDESS. Reemplaza la planilla en papel: cada examinador evalúa a los cursantes en su propio dispositivo y la app reúne las notas en una **planilla oficial** única por examen.\n\nHay tres tipos de usuario:\n\n- **Examinador**: evalúa a los cursantes del examen al que fue asignado y firma la planilla oficial.\n- **Jefe de mesa**: es uno de los examinadores del examen. Además de evaluar, habilita las firmas, confirma los cambios que pide Dirección y firma último.\n- **Dirección y Administración**: organizan los exámenes. No evalúan.\n\nSe usa desde el navegador de una computadora, tablet o celular. Para sincronizar con el resto de la mesa hace falta conexión a internet.\n\n## 2. Crear tu acceso (primer ingreso)\n\nDirección carga tu nombre y tu correo antes de que puedas entrar. Hasta que eso no pase, la app no te va a dejar crear el acceso.\n\n1. Abrí la dirección de AppEXAM en el navegador.\n2. Elegí **Primer ingreso: crear mi acceso**.\n3. Escribí el **mismo correo** que le diste a Dirección y elegí una contraseña.\n4. Confirmá. A partir de ahí entrás siempre con **Ingresar**, con tu correo y tu contraseña.\n\nSi te olvidaste la contraseña, usá **Olvidé mi contraseña** en la pantalla de ingreso. Para salir, usá el bloque **Sesión**.\n\nNecesitás tu contraseña también para **firmar** la planilla oficial (ver sección 9).\n\n## 3. Mis Exámenes: tu pantalla de inicio\n\nAl ingresar ves la pestaña **Mis Exámenes**. Ahí aparece el cuadro **Mi examen en curso** con el examen que te asignó Dirección. Si todavía no te asignaron ninguno, dice que no tenés un examen en curso.\n\nCuando estás asignado a un examen en curso, se suman estas pestañas:\n\n- **Planilla**: tu planilla de evaluación.\n- **Notas finales**: el resumen de tus notas por cursante.\n- **Planilla oficial**: la planilla común de la mesa, que solo aparece mientras tu examen está en curso.\n- **Registro de planillas oficiales**: los exámenes que ya cerraron y en los que participaste.\n\n## 4. La planilla: encabezado y maniobras\n\nEn la pestaña **Planilla** elegís primero al cursante:\n\n1. En **Alumno que se evalúa (por dorsal)** elegí al cursante de la lista. Los alumnos los cargó Dirección o el jefe de mesa.\n2. Se completan solos el **alumno**, el **dorsal**, la **delegación**, la **fecha** y tu nombre como **profesor**.\n3. Más abajo aparecen las maniobras que corresponden al tipo de examen, agrupadas por módulo (Básicos, Perfeccionamiento y Técnicos).\n\nCada maniobra es una tarjeta, por ejemplo **Feedback Cuña · Nivel 1**, con sus dos bajadas (**Bajada 1** y **Bajada 2**). Cada bajada se evalúa por separado.\n\nPara el detalle de los criterios de cada maniobra y sus reglas, mirá el **Tutorial de maniobras**.\n\n## 5. Evaluar una bajada\n\n1. Elegí la pestaña **Bajada 1** o **Bajada 2** de la maniobra.\n2. Marcá una opción en cada criterio. Algunas opciones quedan **deshabilitadas** cuando no tienen sentido con lo ya marcado (por ejemplo, no se puede describir un defecto en un apoyo calificado como excelente). Al pasar el cursor se lee \"No disponible según lo marcado en otros criterios\".\n3. Escribí la **nota de la bajada**, en múltiplos de 5.\n4. Cuando están todos los criterios y la nota, aparece el botón **Confirmar** (ver sección 6).\n\nMientras completás, la tarjeta muestra cuántos criterios llevás (\"3 de 8 criterios evaluados\"). Si te falta alguno, al intentar confirmar la app te dice cuáles son.\n\nSi querés empezar de nuevo una maniobra, usá **Reiniciar maniobra**. El botón cambia a «¿Seguro? Tocá de nuevo para borrar» y hay que tocarlo otra vez en 5 segundos; si no, se cancela.\n\n### Comentarios\n\n- Los criterios que marcás se convierten en un **comentario automático** que se arma solo.\n- En **Comentarios adicionales** podés escribir lo que quieras sumar.\n- Con el micrófono podés **dictar**. Lo dictado queda en el cuadro **Transcripción**.\n\n### Voz\n\nEl botón **Comandos de voz** te deja marcar criterios hablando. Un ejemplo: «ritmo regular lento, apoyos no derrapa, ejes rotación regular, nota treinta y cinco». La app muestra lo que entendió y vos elegís **Aplicar** o **Descartar**. Hay que dar permiso al micrófono del navegador y no todos los dispositivos lo permiten.\n\n## 6. Confirmar la nota\n\n1. Al tocar **Confirmar**, la nota de esa bajada queda fija y aparece **✓ Confirmada**.\n2. Si necesitás corregir, usá **Editar**. La nota vuelve a ser modificable y hay que confirmarla otra vez.\n3. Una nota que no se confirmó **no cuenta** para la planilla oficial.\n\nLa app te indica si la nota **aprueba o desaprueba** según la nota base del examen. Si se cumple alguno de los **parámetros de desaprobación**, te muestra una **sugerencia de nota** por debajo de la base. Es una ayuda: la nota final la decidís vos.\n\nSi en una maniobra marcás que el cursante **no interpreta la maniobra**, la nota queda en **NIM** y no se asigna número.\n\n## 7. Notas finales\n\nLa pestaña **Notas finales** muestra una fila por cursante y una columna por maniobra.\n\n- Cada celda muestra la **nota más alta de las dos bajadas**, cuando ambas están confirmadas.\n- El guion **—** significa que falta confirmar una bajada.\n- **NIM** significa que no interpretó la maniobra.\n- El botón **Ver comentarios** de cada fila despliega los comentarios de cada maniobra de ese cursante.\n- Con el nombre del cursante volvés a su planilla.\n\n## 8. La planilla oficial\n\nLa **planilla oficial** reúne las notas de todos los examinadores. **Nadie puede modificarla**: sus notas surgen de lo que cada examinador confirmó.\n\n- Cada miembro de la mesa aporta la **nota más alta de sus dos bajadas** en cada maniobra.\n- La nota base depende del examen (por ejemplo 40, 45 o 55) y se muestra arriba.\n- En **Protocolo aplicado** se explica cómo se calcula la nota promediada según la cantidad de examinadores:\n  - **Mesa de 2**: se promedian las dos notas. Si el promedio aprueba se conserva exacto; si no, se redondea hacia abajo de 5 en 5.\n  - **Mesa de 3**: si dos desaprueban y uno aprueba, se descarta la nota alta y se promedian las otras dos. Si dos aprueban y uno desaprueba, se descarta la baja y se promedian las otras dos. Si hay unanimidad, se promedian las tres.\n  - **Mesa de 4**: no está permitida. Hay que sumar o quitar un examinador.\n  - **Mesa de 5**: se descartan la nota más alta y la más baja, y con las tres que quedan se aplica la regla de la mesa de 3.\n- Los promedios que aprueban se muestran con hasta dos decimales, sin redondear hacia arriba.\n- **NIM** no tiene nota: no se promedia y pasa directo como resultado.\n\nSi falta alguna planilla por confirmar, la app lo avisa arriba.\n\n## 9. Firmas y cierre del examen\n\nLa planilla oficial es válida cuando firman todos los examinadores. Las firmas están en el bloque **Firmas**, al final de la planilla oficial.\n\n1. El **jefe de mesa** presiona **Habilitar firmas** cuando las notas están listas. Hasta entonces nadie puede firmar.\n2. Cada examinador escribe su contraseña en **Mi contraseña para firmar** y presiona **Firmar planilla**.\n3. Si todavía no firmaste, podés revisar la planilla. Una vez firmada, podés usar **Retirar mi firma** mientras el jefe de mesa no haya firmado.\n4. Si alguien corrige una nota después de firmar, **las firmas se anulan** y hay que firmar de nuevo.\n5. El **jefe de mesa firma último**. Es su responsabilidad comprobar que los demás examinadores hayan firmado. Si falta alguien, la app no lo deja firmar y le dice quién falta.\n\n**Importante:** la firma del jefe de mesa **cierra el examen y no hay vuelta atrás**. Después nadie puede modificar la planilla oficial, retirar firmas ni reabrir el examen. La app lo advierte antes de firmar. El botón del jefe de mesa dice **Firmar y cerrar el examen**.\n\n## 10. Si sos jefe de mesa\n\nAdemás de evaluar, tenés estas tareas:\n\n- **Alumnos inscriptos**: podés agregar o quitar alumnos del examen desde **Gestionar alumnos inscriptos**.\n- **Cambios pedidos por Dirección**: mientras el examen está en curso, Dirección no puede cambiarlo sola. Te llega un cuadro **Cambios solicitados por Dirección** (y un punto ● en la pestaña Mis Exámenes) con el detalle. Usá **Aprobar** para aplicarlos o **Rechazar** para descartarlos.\n- **Habilitar firmas** cuando las notas estén listas, y **Reabrir planilla** si algún examinador necesita corregir. Reabrir borra todas las firmas.\n- **Firmar último**, después de comprobar que todos firmaron.\n\n## 11. Registro de planillas oficiales\n\nEsta pestaña guarda las planillas de los exámenes **cerrados** en los que participaste.\n\n- Son de **solo lectura**: nadie puede editarlas.\n- Un examen aparece acá solo después de que el jefe de mesa lo cerró con su firma.\n\n## 12. Consejos y problemas frecuentes\n\n- **No veo ningún examen**: Dirección todavía no te asignó a uno, o el examen ya cerró (buscalo en el Registro).\n- **No me deja crear el acceso**: el correo tiene que ser exactamente el que cargó Dirección. Pedile que lo revise.\n- **No aparece el botón Confirmar**: falta algún criterio o la nota. La tarjeta lista lo que falta.\n- **Una opción está deshabilitada**: depende de lo que marcaste en otro criterio. Cambiá ese criterio o elegí otra opción.\n- **No puedo firmar**: el jefe de mesa todavía no habilitó las firmas, o sos el jefe de mesa y faltan firmas de otros examinadores.\n- **Mis firmas desaparecieron**: alguien modificó una nota. Hay que firmar de nuevo.\n- **Sin conexión**: la app avisa y no guarda los cambios. Reintentá cuando vuelva.\n- Confirmá siempre tus notas antes de que el jefe de mesa habilite las firmas.\n\n## 13. Resumen rápido\n\n1. Creá tu acceso con **Primer ingreso** y el correo que cargó Dirección.\n2. Entrá a **Mis Exámenes** y abrí la **Planilla**.\n3. Elegí el cursante, evaluá cada bajada y **Confirmá** las notas.\n4. Revisá las **Notas finales** y la **Planilla oficial**.\n5. Firmá con tu contraseña. El jefe de mesa firma último y cierra el examen.\n", "m": "# Tutorial de maniobras\n\nCómo completar la planilla de cada maniobra: escalas, criterios, reglas que bloquean opciones, notas, NIM y comentarios, con el detalle de cada maniobra por nivel.\n\n## 1. Cómo está armada una planilla de maniobra\n\nCada maniobra es una tarjeta con este formato: **Feedback · nombre de la maniobra · nivel** (por ejemplo, Feedback Corto Paralelo · Nivel 2).\n\n- Tiene dos pestañas, **Bajada 1** y **Bajada 2**. Cada bajada se evalúa y se califica por separado.\n- En cada bajada hay una grilla de **criterios** (Ritmo, Apoyos, Ejes, etc.). Cada criterio es un cuadro con botones de opciones.\n- Arriba de la grilla están la **nota de la bajada**, el botón **Confirmar** y el contador de criterios evaluados.\n- Abajo de la grilla puede aparecer el cuadro **Parámetros de desaprobación**.\n- **Reiniciar maniobra** borra todo lo cargado en esa maniobra. Hay que tocarlo dos veces.\n\n## 2. Las escalas de calificación\n\nCasi todos los criterios empiezan con una **calificación** y siguen con **observaciones**.\n\n- **Escala corta:** OK, R (regular) y NO.\n- **Escala de cinco:** NO, R (regular), B (bueno), MB (muy bueno) y EXC (excelente).\n\nDespués de la calificación, algunos criterios muestran grupos de opciones que describen **qué se vio**. Ejemplos: la forma de la curva (Arco, Cuerda, Flecha, Irregular, Diagonal) o en qué lado ocurrió (IZQ, DER). Los grupos que dicen \"IZQ / DER\" indican el lado.\n\nPara marcar, tocá la opción. Para sacarla, tocala de nuevo. En los grupos donde se permite elegir varias, podés marcar más de una.\n\n## 3. Evaluar una bajada paso a paso\n\n1. Elegí la maniobra y la bajada.\n2. Recorré los criterios y marcá una opción en cada uno. Cada criterio cuenta como evaluado cuando tiene al menos una opción marcada.\n3. Escribí la **nota de la bajada**, en múltiplos de 5.\n4. Revisá el contador (\"8 de 8 criterios evaluados\") y presioná **Confirmar**.\n5. Si necesitás corregir, **Editar**; después volvé a confirmar.\n\nSi falta algún criterio, al intentar confirmar la app indica exactamente cuáles son. En **Fuera de Pista** también hay que elegir antes si la bajada fue **Corto** o **Super** (ver sección 9).\n\n## 4. Qué maniobras tiene cada examen\n\nCada tipo de examen trae sus maniobras y su **nota base** de aprobación.\n\n- **Ingreso a Nivel 1:** Corto Paralelo y Super Paralelo (Nivel 1). Base 40.\n- **Ingreso a Nivel 3:** Corto Paralelo, Super Paralelo, Bumps y Curva Intermedia Básica (Nivel 3). Base 55.\n- **Ingreso a Nivel 4:** Super Paralelo, Corto Paralelo, Bumps y Fuera de Pista (Nivel 4). Base 50.\n- **Técnico Nivel 1:** Cuña, Elemental, Corto Paralelo y Super Paralelo. Base 40.\n- **Técnico Nivel 2:** Corto Paralelo, Super Paralelo, Curva Intermedia Básica, Fuera de Pista y Bumps. Base 40.\n- **Técnico Nivel 3:** Cuña, Elemental, Curva Intermedia Básica, Curva Intermedia, Corto Paralelo, Super Paralelo, Bumps y Fuera de Pista. Base 40; en Bumps y Fuera de Pista la base es 45.\n- **Técnico Nivel 4:** Super Paralelo, Corto Paralelo, Curva Intermedia, Bumps y Fuera de Pista. Base 40.\n\nLos módulos son **Básicos** (Cuña, Elemental, Curva Intermedia Básica), **Perfeccionamiento** (Corto y Super Paralelo, Curva Intermedia) y **Técnicos** (Fuera de Pista y Bumps).\n\n## 5. Criterios que se repiten\n\n- **Interp. maniobra:** si el cursante interpreta la maniobra (Sí o No), con observaciones (No natural, Estático, Exagerado, Errático). Si marcás **No**, la bajada queda en **NIM** (ver sección 10).\n- **Ritmo:** calificación con OK, R o NO, y si es Lento o Alto. Incluye también la **Velocidad** (Alta, Baja o Varía).\n- **Diseño curva:** calificación y lado (IZQ o DER), más la forma de la curva (Arco, Cuerda, Flecha, Irregular o Diagonal).\n- **Apoyos:** calificación de cinco, más defectos: A Frame, Derrapa, Pivoteos o Inestable.\n- **Ejes:** calificación de cinco, más el tipo (Rot., Inc., C.Rot) y el lado (IZQ o DER).\n- **Gestión de carga:** calificación de cinco, más qué falla: Falta al inicio, Exceso final, Retiene finales, No se adapta o Flotado.\n- **Encadenamiento:** si es directo (DIR) o indirecto (IND), y con qué frecuencia (A veces, Casi siempre o Siempre).\n- **Ant. visual:** anticipación visual. Calificación y, si hace falta, hacia dónde mira (Hacia adentro, A los pies) y de qué lado.\n- **ADE:** actitud dinámica de equilibrio. Calificación y dónde se ve el problema: Postura adelantada (AD.), Postura retrasada (RETR.), Tobillos (TOB.), Cadera (CAD.) o Rodillas (ROD.).\n- **Uso bastón:** calificación y cómo se usa: Acompaña, Rebota o Ap. circular (apronte circular).\n\nLos nombres exactos varían un poco entre maniobras. Lo que sigue explica las diferencias.\n\n## 6. Cuña y Elemental (Nivel 1 y Nivel 3)\n\nSon las maniobras básicas de Nivel 1 y Nivel 3. Comparten un grupo de criterios:\n\n- **Imagen gral.:** escala de cinco, más observaciones (No natural, En bloque, Forzado).\n- **Ant. visual:** escala corta, más hacia dónde mira (Eje pista, Eje avance, Adentro).\n- **Diseño curva:** escala de cinco, más la forma (Arco, Cuerda, Flecha, Zig zag, Diagonal).\n- **Apoyos:** escala de cinco, más defectos propios de la maniobra y el lado.\n- **Velocidad:** escala corta, Alta, Baja o Varía, y observaciones propias.\n- **ADE**, **Ejes** y **Uso bastón**.\n\n**Cuña:** los apoyos describen la cuña (Aplana interno, Pierde cuña, Cuña resistida). En velocidad se anota si hay exceso de rozamiento o si la curva fue cortada.\n\n**Elemental:** además incluye **Reunión** (Temprana, Tardía o Activa) y en la curva se anotan No prepara y Confunde fases. Los apoyos describen la toma de carga: Toma carga int., Elimina cuña o Deriva lateral. En el bastón figura el apronte en finalización.\n\nReglas de estas maniobras (se explican en la sección 11): cuando la calificación es muy alta, algunos defectos quedan sin habilitar, y las marcas Diagonal, No prepara y Confunde fases limitan las calificaciones posibles.\n\n## 7. Corto y Super Paralelo\n\nSon las maniobras de Perfeccionamiento. En **Nivel 2, 3 y 4** usan los criterios comunes de la sección 5.\n\nEn **Nivel 1** cambian algunos criterios:\n\n- **Imagen gral.** reemplaza a la interpretación. Tiene una escala de cinco y las observaciones **No interpreta**, No natural, Estático, Exagerado y Errático. Marcar **No interpreta** deja la bajada en NIM.\n- **Gestión de carga** y **Apoyos** tienen sus propias opciones.\n- El **Encadenamiento indirecto (IND)** con frecuencia «Casi siempre» o «Siempre» cuenta como parámetro de desaprobación.\n\n## 8. Curva Intermedia y Curva Intermedia Básica\n\n- **Curva Intermedia** (Nivel 3 y 4) usa los criterios comunes de la sección 5.\n- **Curva Intermedia Básica** (Nivel 2 y 3) tiene su propio juego: imagen general, ritmo con velocidad, diseño de curva, gestión de carga, apoyos con lado, ejes, tipo de encadenamiento, ADE, anticipación visual y bastón.\n\n## 9. Fuera de Pista\n\nSe usa en Nivel 2, 3 y 4. Cada bajada se hace como **Corto** o como **Super**.\n\n1. Antes de completar los criterios, elegí **Corto** o **Super** para la bajada (hay un selector debajo de las pestañas de bajada).\n2. La app no deja confirmar la bajada si no elegiste una de las dos.\n3. En los comentarios la bajada se identifica como «Corto Paralelo» o «Super Paralelo».\n\nLos criterios incluyen interpretación, ritmo con velocidad, diseño de curva, anticipación visual, ejes, gestión de carga, encadenamiento, **adaptación al terreno** (No anticipa, Reactivo, Miedo, Apoyo Alt.), ADE y bastón.\n\n## 10. Bumps\n\nSe usa en Nivel 2, 3 y 4. Sus criterios son: interpretación, ritmo con velocidad, anticipación visual, **gestión de carga** (Pierde contacto, Rebota, Retiene, No se adapta), adaptación al terreno, **estrategia** (Pivot, Derrapaje, Freno, Diag.), ejes, apoyos (A Frame, Alternado, Pivoteos, Inestable, y el lado), ADE y bastón.\n\n## 11. Reglas que bloquean opciones\n\nLa app deshabilita las opciones incompatibles para evitar planillas contradictorias. Una opción gris no se puede tocar. Al pasar el cursor aparece «No disponible según lo marcado en otros criterios». Las más habituales:\n\n- **Observaciones con calificación alta:** si calificás **Apoyos** como MB o EXC, no podés marcar defectos de apoyo. Lo mismo pasa con **Imagen gral.**, **Diseño curva** y **Reunión** en Cuña y Elemental, y con **Gestión de carga** en el Nivel 1 de Corto y Super Paralelo.\n- **Ant. visual, ADE y Uso bastón con OK:** si la calificación es OK, no se marcan observaciones.\n- **Apoyos bajos y carga:** si marcás Apoyos en R o NO, **Gestión de carga** solo admite R o NO.\n- **Ejes:** si marcás detalles de ejes, la calificación posible depende del nivel del examen (en Nivel 1: NO, R o B; en Nivel 2: NO o R; en los demás solo NO).\n- **Diagonal:** al marcar Diagonal en el diseño de la curva se limitan las calificaciones y las formas que podés sumar.\n- **Interp. en No / No interpreta:** no se puede calificar OK en Ritmo ni en Diseño curva.\n- **Velocidad «Varía»:** solo se habilita si la calificación de velocidad es R o NO (excepto en Elemental).\n- **Cuña y Elemental:** con ciertas calificaciones altas se bloquean defectos de velocidad, ejes y bastón. En Elemental, marcar **No prepara** o **Confunde fases** limita las calificaciones del diseño de curva.\n\nSi necesitás una opción bloqueada, primero cambiá el criterio que la bloquea.\n\n## 12. Nota, NIM y parámetros de desaprobación\n\n- **Nota base:** depende del examen (sección 4). Una nota igual o mayor que la base aprueba; menor desaprueba. La tarjeta lo indica: «Aprobada» o «Desaprobada (base 40)».\n- **NIM (No interpreta la maniobra):** se activa si marcás **No** en Interp. maniobra, o **No interpreta** en Imagen gral. (Nivel 1). La bajada queda sin nota (NIM) y los demás criterios no cuentan para la nota, pero sí aparecen en los comentarios.\n- **Parámetros de desaprobación:** debajo de la grilla se listan las condiciones que sugieren una nota menor que la base, marcadas como «Se cumple» o «No se cumple». Son, según la maniobra:\n  - Interpretación marcada en No.\n  - R en la mayoría de las casillas de evaluación.\n  - Encadenamiento indirecto (IND). En Nivel 1, solo si la frecuencia es «Casi siempre» o «Siempre».\n  - Ritmo y Diseño de curva, ambos en NO.\n  - Apoyos o Ejes en NO.\n  - En Cuña y Elemental: Imagen general en NO. En Elemental: Diseño de curva con «Confunde fases».\n- Cuando se cumple alguno, aparece **Sugerencia de nota menor que la base**. Es una sugerencia: la nota la escribís vos.\n\n## 13. Comentarios\n\n- A medida que marcás criterios, la app arma un **comentario automático** por bajada, con el estilo «En la imagen general se observó un desempeño bueno. El diseño de curva es excelente…».\n- En **Comentarios adicionales** podés escribir lo que quieras sumar. Aparece al final del comentario.\n- Con el botón de micrófono podés **dictar**. Lo dictado se guarda en **Transcripción**.\n- **Comandos de voz** marca criterios por voz. Ejemplo: «ritmo regular lento, apoyos no derrapa, ejes rotación regular, nota treinta y cinco». La app muestra lo que entendió y elegís **Aplicar** o **Descartar**.\n- Los comentarios de cada maniobra se leen después en **Notas finales**, con el botón **Ver comentarios** de cada cursante.\n\n## 14. Consejos\n\n- Completá la bajada de corrido y confirmá la nota enseguida, mientras tenés fresca la evaluación.\n- Si una opción está bloqueada, revisá el criterio que la limita antes de pensar que es un error.\n- Mirá siempre los **Parámetros de desaprobación** antes de poner la nota.\n- Una nota sin **Confirmar** no entra en la planilla oficial.\n- Si te equivocás en toda una maniobra, **Reiniciar maniobra** la deja en blanco.\n", "d": "# AppEXAM · Tutorial para Dirección\n\nGuía paso a paso para el usuario **Dirección** de AADIDESS: cómo ingresar, cargar examinadores, crear y gestionar exámenes, seguir el avance y consultar los registros.\n\n## 1. Qué puede hacer Dirección\n\nDirección es el usuario que organiza los exámenes. Con su acceso podés:\n\n- Cargar y mantener la lista de **examinadores** (nombre, correo y nivel de validación).\n- **Crear exámenes**: elegir tipo, fecha, delegación, examinadores y alumnos.\n- Ver los **exámenes en curso por delegación** y modificarlos, finalizarlos o eliminarlos.\n- Ver la **planilla oficial** de cada examen y el **registro** de las ya cerradas.\n- Ver quién está conectado en este momento (lista de presencia).\n- Consultar la pestaña **Información**: tutoriales y previsualización de las planillas de cada nivel.\n\nEl usuario **Administrador** tiene las mismas opciones y además gestiona a los usuarios de Dirección.\n\n## 2. Ingreso y pantalla principal\n\n1. Abrí la dirección de AppEXAM en el navegador (computadora, tablet o celular).\n2. Ingresá con tu correo y contraseña. Si es tu primer ingreso, usá la opción de primer ingreso con el correo que Administración tiene registrado para tu usuario y creá tu contraseña.\n3. Arriba ves el logo de AADIDESS y, debajo, las pestañas de navegación: **Inicio · Gestión de exámenes · Registro de planillas oficiales · Usuarios · Información**.\n\nCada pestaña se abre con un clic. La pestaña activa se muestra resaltada.\n\n## 3. Usuarios: cargar la lista de examinadores\n\nAntes de crear un examen, los examinadores tienen que estar cargados. Entrá en la pestaña **Usuarios**.\n\n### 3.1 Agregar un examinador a mano\n\n1. En el bloque **Examinadores**, completá **Nombre** y **Correo**.\n2. Opcionalmente indicá su **Validación** (nivel del 1 al 5, ver 3.4).\n3. Tocá el botón para agregar. El examinador aparece en la lista.\n\n### 3.2 Cargar muchos examinadores desde Excel o CSV\n\n1. Preparé una planilla con dos columnas: **nombre** y **correo**.\n2. En el bloque de examinadores, elegí el archivo `.xlsx` o `.csv`.\n3. Revisá el mensaje de resultado: indica cuántos se agregaron y cuáles se omitieron (por ejemplo, correos repetidos o inválidos).\n\nNota: leer un `.xlsx` necesita conexión a internet. Si falla, probá guardar el archivo como `.csv`.\n\n### 3.3 La lista de examinadores\n\n- Se muestra como una planilla de Excel, con columnas **Nombre · Validación · Correo**.\n- Es **desplegable**: usá \"Ver lista de examinadores\" para abrirla o cerrarla.\n- Con el **buscador** filtrás por nombre o correo.\n- **Quitar** elimina al examinador de la lista. No revoca el acceso de una cuenta que ya haya creado.\n\n### 3.4 Validación de nivel\n\nLa columna **Validación** indica hasta qué nivel de examen (1 a 5) está habilitado cada examinador. La carga Dirección con el desplegable de cada fila.\n\n- Es **informativa**: al asignar un examinador a un examen de nivel mayor al suyo, la app muestra una advertencia, pero no lo impide.\n- \"—\" significa sin validar.\n\n## 4. Gestión de exámenes: crear un examen nuevo\n\nEn la pestaña **Gestión de exámenes** se crean exámenes nuevos. Tocá **Nuevo examen** y completá:\n\n1. **Tipo de examen**: Ingreso (a Nivel 1, 3 o 4) o Técnico (Nivel 1 a 4). Cada tipo trae sus maniobras y su **nota base** de aprobación.\n2. **Fecha** y **delegación** donde se rinde.\n3. **Examinadores**: se eligen de la lista cargada en Usuarios. La lista del examen muestra la validación de cada uno.\n4. **Jefe de mesa**: marcá quién cumple ese rol (ver sección 7).\n5. **Alumnos inscriptos**: cargalos a mano o con un Excel/CSV (nombre y dorsal).\n6. Guardá y confirmá la creación.\n\nReglas a tener en cuenta:\n\n- Un examinador o un alumno **no puede estar en dos exámenes sin finalizar** a la vez. La app avisa el conflicto.\n- Los alumnos pertenecen a la delegación del examen.\n\n## 5. Inicio: exámenes en curso por delegación\n\nLa pestaña **Inicio** muestra una tarjeta por cada delegación, ordenadas por cantidad de exámenes en curso (las que tienen exámenes van primero).\n\n1. En la tarjeta de la delegación, cada examen en curso es un botón (por ejemplo, \"Técnico Nivel 2 · 15/11\").\n2. Al elegir uno, los demás se atenúan y debajo aparece el cuadro **Gestión de Examen** con los datos: tipo, fecha, examinadores (y jefe de mesa) y alumnos inscriptos.\n3. Desde ese cuadro podés:\n   - **Modificar examen**: cambiar examinadores, alumnos, fecha, etc.\n   - **Planilla oficial**: abrirla para consultarla.\n   - **Finalizar examen**: cerrarlo (ver sección 7).\n   - **Eliminar examen**: borrarlo definitivamente. Pide confirmación y **no se puede deshacer**.\n\nMientras un examen está en curso, **cada cambio necesita la confirmación del jefe de mesa**. Dirección envía la propuesta y el jefe de mesa la acepta.\n\n## 6. La planilla oficial\n\nCada examen tiene una **planilla oficial** donde se consolidan las notas de todos los cursantes y maniobras.\n\n- Las **notas finales** de cada cursante se arman a partir de lo confirmado por los examinadores. Con el botón **Ver comentarios** de cada cursante se leen los comentarios automáticos de cada maniobra.\n- **NIM** indica \"no interpreta la maniobra\". Una nota por debajo de la base es desaprobada.\n- Solo el **jefe de mesa** puede modificarla. Los demás examinadores la ven y la firman; Dirección la consulta.\n\n## 7. Firma y cierre del examen\n\nEl examen se **cierra** cuando firman todos los examinadores y, por último, el jefe de mesa.\n\n1. Cada examinador firma la planilla oficial.\n2. El **jefe de mesa firma al final**. Es su responsabilidad comprobar que todos hayan firmado. Si falta alguna firma, la app no lo deja firmar y se lo avisa.\n3. **La firma del jefe de mesa cierra el examen y no hay vuelta atrás**: ni el examen ni la planilla se pueden editar ni reabrir.\n\nLa app muestra esta advertencia antes de firmar.\n\n## 8. Registro de planillas oficiales\n\nLa pestaña **Registro de planillas oficiales** guarda todas las planillas de exámenes cerrados.\n\n- Son de **solo lectura**: nadie las puede editar una vez finalizado el examen.\n- Los examinadores ven en su registro solo los exámenes en los que participaron.\n\n## 9. Información\n\nLa pestaña **Información** reúne:\n\n- **Tutoriales**: botones al tutorial de uso general y al tutorial de maniobras.\n- **Planillas por nivel**: previsualización de las planillas de cada nivel y prueba de criterios, sin guardar datos de ningún examen.\n\n## 10. Quién está conectado\n\nEn la pestaña **Usuarios** (versión en línea) se ve la lista de **usuarios conectados**, con su rol y hace cuánto estuvieron activos. Solo la ven Dirección y Administración.\n\n## 11. Consejos y problemas frecuentes\n\n- **No aparece un examinador al crear el examen**: verificá que esté cargado en Usuarios y que no esté ya en otro examen sin finalizar.\n- **La advertencia de nivel**: es informativa. Revisá la Validación del examinador antes de asignarlo.\n- **No se puede modificar un examen en curso**: los cambios necesitan la confirmación del jefe de mesa.\n- **Un examen cerrado no se puede reabrir**: por eso conviene revisar todo antes de que el jefe de mesa firme.\n- **El Excel no carga**: guardalo como `.csv` o revisá la conexión.\n- **Sin conexión**: la app avisa y no guarda los cambios. Reintentá cuando vuelva.\n\n## 12. Resumen rápido\n\n1. Cargá los examinadores en **Usuarios**.\n2. Creá el examen en **Gestión de exámenes**.\n3. Seguilo y modificalo desde **Inicio**, en la tarjeta de su delegación.\n4. Los examinadores cargan las notas; el jefe de mesa verifica las firmas y firma último.\n5. Consultá el resultado en el **Registro de planillas oficiales**.\n"};

function mdHtml(s){
  const il=x=>esc(x).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
  let o='',st=[],para=[];
  const fp=()=>{if(para.length){o+='<p>'+il(para.join(' '))+'</p>';para=[]}};
  const close=n=>{while(st.length>n)o+='</li></'+st.pop().t+'>'};
  for(const ln of s.split('\n')){
    let m;
    if(!ln.trim()){fp();continue}
    if(m=ln.match(/^(#{1,3})\s+(.*)/)){fp();close(0);const l=m[1].length;o+='<h'+(l+1)+'>'+il(m[2])+'</h'+(l+1)+'>';continue}
    if(m=ln.match(/^(\s*)([-*]|\d+\.)\s+(.*)/)){
      fp();const d=Math.floor(m[1].length/2)+1,ty=/\d/.test(m[2])?'ol':'ul';
      if(st.length>d)close(d);
      if(st.length===d){o+='</li>';if(st[d-1].t!==ty){o+='</'+st.pop().t+'>'}}
      while(st.length<d){o+='<'+ty+'>';st.push({t:ty})}
      o+='<li>'+il(m[3]);continue}
    if(st.length&&/^\s+/.test(ln)){o+=' '+il(ln.trim());continue}
    close(0);para.push(ln.trim());
  }
  fp();close(0);return o;
}

function parseCSV(t){
  t=t.replace(/^﻿/,'');
  const first=t.split(/\r?\n/)[0]||'';
  let del=',',best=1;[';','\t',','].forEach(d=>{const c=first.split(d).length;if(c>best){best=c;del=d}});
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'&&t[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
    else if(c==='"')q=true;
    else if(c===del){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}

function rowsToEx(rows){
  rows=rows.map(r=>r.map(c=>String(c==null?'':c).trim())).filter(r=>r.some(Boolean));
  if(!rows.length)return[];
  const h=rows[0].map(nz),hdr=h.some(x=>/nombre|apellido|examinador|correo|mail/.test(x)&&!/@/.test(x));
  let iN=0,iE=1,iAp=-1,iNo=-1,iV=-1;
  if(hdr){
    iAp=h.findIndex(x=>/^apellidos?$/.test(x));iNo=h.findIndex(x=>/^nombres?$/.test(x));
    const full=h.findIndex(x=>/examinador|apellido y nombre|nombre y apellido|nombre completo/.test(x));
    iE=h.findIndex(x=>/correo|mail/.test(x));iV=h.findIndex(x=>/validaci|nivel/.test(x));
    iN=full>=0?full:((iAp>=0||iNo>=0)?-1:0);
    if(iE<0)iE=1;
    rows=rows.slice(1);
  }
  return rows.map(r=>{let e=(r[iE]||'').trim();let n=(iN>=0?r[iN]||'':[r[iAp],r[iNo]].filter(Boolean).join(' ')).trim();
    if(!/^\S+@\S+\.\S+$/.test(e)){const c=r.find(x=>/^\S+@\S+\.\S+$/.test(x));if(c){e=c;if(n===c)n=r.find(x=>x&&x!==c)||''}}
    const nm=String(iV>=0?r[iV]||'':'').match(/[1-5]/);return{n:n.slice(0,80),e:e.toLowerCase(),v:nm?Number(nm[0]):0}}).filter(x=>x.n||x.e);
}
async function importUsrEx(f){
  if(!f||!isMgr())return;
  try{
    const list=rowsToEx(await readRows(f));
    if(!list.length){usrMsg='No encontré examinadores en el archivo. Revisá que tenga las columnas Nombre y Correo.';renderGestion();return}
    INV=INV||{};let ok=0,dup=0,bad=0,den=0;
    for(const x of list){
      if(!x.n||!/^\S+@\S+\.\S+$/.test(x.e)){bad++;continue}
      if(Object.entries(INV).some(([k,v])=>v&&(k===ek(x.e)||nz(v.name||'')===nz(x.n)))){dup++;continue}
      try{await cInvite(x.n,x.e,'prof',x.v);INV[ek(x.e)]={name:x.n,role:'prof',k:fk(x.n),niv:x.v||undefined};ok++}
      catch(er){if(er&&er.denied){den++;break}else throw er}
    }
    usrMsg=den?'Sin permiso para agregar. Revisá las reglas de Firebase.':`Se cargaron ${ok} examinadores${dup?` (${dup} repetidos omitidos)`:''}${bad?` (${bad} filas sin nombre o con correo inválido omitidas)`:''}. Cada uno debe crear su acceso con su correo.`;
  }catch(e){usrMsg='No pude leer el archivo. Probá con un .xlsx o .csv, o revisá tu conexión (el Excel necesita internet para leerse).'}
  renderGestion();
}

const t2=m=>Math.floor(m*100+1e-9)/100;
function protocolo(notes,b){
  const n=notes.length;
  if(n<2)return{err:'Faltan notas: la mesa debe ser de 2, 3 o 5 miembros'};
  if(n===4)return{err:'Mesa de 4 no permitida: agregar o quitar un profesor'};
  if(n>5)return{err:'Mesa no prevista (más de 5 miembros)'};
  let a=[...notes].sort((x,y)=>x-y);const p=[];let f;
  if(n===5){p.push(`Se eliminan la nota más baja (${a[0]}) y la más alta (${a[4]})`);a=a.slice(1,4)}
  if(a.length===2){
    const m=(a[0]+a[1])/2;
    if(m>=b){f=t2(m);p.push(`Promedio de ${a.join(' y ')} = ${f}`)}
    else{f=Math.floor(m/5)*5;p.push(`Promedio de ${a.join(' y ')} = ${t2(m)}; reprobado, se redondea hacia abajo a ${f}`)}
  }else{
    const ap=a.filter(x=>x>=b).length;let u=a;
    if(ap===1){u=a.slice(0,2);p.push(`Dos desaprueban y uno aprueba: se elimina la nota alta (${a[2]})`)}
    else if(ap===2){u=a.slice(1);p.push(`Dos aprueban y uno desaprueba: se elimina la nota baja (${a[0]})`)}
    else p.push(ap===3?'Unanimidad aprobada':'Unanimidad desaprobada');
    f=t2(u.reduce((x,y)=>x+y,0)/u.length);p.push(`Promedio de ${u.join(', ')} = ${f}`);
  }
  return{f,ok:f>=b,p};
}

        const cur=st.c[tgt.s]||'';
        st.c[tgt.s]=cur+(cur?((/\s$/.test(cur)||/^\s/.test(text))?'':' ')+text:text.trimStart());
        const el=document.querySelector(`textarea[data-c="${tgt.s}"]`);if(el)el.value=st.c[tgt.s];save();
      }
    });
    DI.onPartial(({text})=>{if(tgt&&tgt.p&&dv[tgt.p]&&dv[tgt.p].st==='listen'){dv[tgt.p].partial=text;showDv(tgt.p)}});
    DI.onState(({state,reason})=>{
      if(tgt&&tgt.s){
        const b=document.querySelector(`[data-mic="${tgt.s}"]`),on=state!=='idle';
        if(b){b.textContent=on?'⏹️ Detener':'🎙️ Dictar';b.setAttribute('aria-pressed',String(on))}
        micMsg(tgt.s,on?'Escuchando…':'');
      }
      if(state!=='idle'||!tgt||!tgt.p)return;
      const p=tgt.p,d=dv[p];if(!d||d.st!=='listen')return;
      const bad={not_granted:'No hay permiso para usar el micrófono.',unavailable:'El dictado no está disponible en este navegador.',rate_limited:'Demasiados dictados a la vez. Intenta en unos segundos.',upstream_error:'Falló el micrófono o el servicio de voz.'};
      if(bad[reason])dv[p]={st:'err',msg:bad[reason]};
      else if((d.text||'').trim()){if(d.mode==='cmd'){d.prop=parseCmd(d.text,p);d.st='review'}else{interpret(p);return}}
      else dv[p]={st:'idle'};
      showDv(p);
    });
  }
  if(DI)all();
})();
all();
</script>
</body>
