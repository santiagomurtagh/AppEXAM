<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planilla examinadora · Maniobras Nivel 3</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fa;--card:#fff;--ink:#14233b;--mute:#5d6b82;--line:#d3dcea;--blue:#3b6bc8;--sky:#4fc3ee;--chip:#f3f6fb;
--ok:#1f9d55;--mb:#5fb36a;--b:#d9b429;--r:#e48a1c;--no:#d64545;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1826;--card:#172336;--ink:#e8eef8;--mute:#9aa9c0;--line:#2a3a54;--chip:#1e2d45;--blue:#6d97ee}}
:root[data-theme="dark"]{--bg:#0f1826;--card:#172336;--ink:#e8eef8;--mute:#9aa9c0;--line:#2a3a54;--chip:#1e2d45;--blue:#6d97ee}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1,h2{font-family:"Barlow Semi Condensed",Barlow,sans-serif;margin:0}
header{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:26px;line-height:1.1}
h1 small{display:block;font:500 15px Barlow,sans-serif;color:var(--mute);margin-top:4px}
.btns{display:flex;gap:8px}
.btn{font:600 14px Barlow,sans-serif;border:1px solid var(--blue);background:var(--blue);color:#fff;padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.sec{background:transparent;color:var(--blue)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.id{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sky);border-radius:10px;padding:14px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mute);font-weight:500}
input,textarea{width:100%;font:16px Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:3px}
textarea{min-height:70px;resize:vertical}
.sec-card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.sec-h{background:var(--blue);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sec-h h2{font-size:19px;color:#fff}
.sec-h .btn.sec{color:#fff;border-color:#fff;padding:6px 10px;font-size:13px}
.tabs{display:flex;gap:6px}
.tab{font:600 14px Barlow,sans-serif;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.tab[aria-selected=true],.tab[aria-pressed=true]{background:#fff;color:#2a56a8}
.pane{display:none;padding:14px}
.pane.on{display:block}
.top{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
.top .n{width:110px}
.sug{background:var(--no);color:#fff;font:600 14px Barlow,sans-serif;padding:7px 12px;border-radius:8px}
.prog{font-size:13px;color:var(--mute);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.crit{border:1px solid var(--line);border-radius:8px;padding:10px}
.crit h3{font:700 15px "Barlow Semi Condensed",sans-serif;margin:0 0 6px;color:var(--blue)}
.grp{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px}
.grp:last-child{margin-bottom:0}
.crit.cbl{display:flex;flex-direction:column}
.crit.cbl .grp.nbl{margin-top:auto;border-top:0;padding-top:10px;margin-bottom:0;justify-content:flex-start}
.crit .grp+.grp{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.grp>.gl{padding-left:0}
.grp.lr{justify-content:space-between}
.cst{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;margin:0 6px 6px 0;vertical-align:top}.cs{font:600 11px/1.2 Inter,sans-serif;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--mute)}.cs.a{background:#e3f4e8;border-color:#9fd3ae;color:#1d6b3a}.cs.p{background:#fff3d6;border-color:#e6c776;color:#8a5a00}
.crit .grp{justify-content:space-between}
.crit.lrc{display:flex;flex-direction:column}
.crit.lrc .grp.lrb{margin-top:auto;border-top:0;padding-top:10px;margin-bottom:0;justify-content:space-between}
.crit.lrc .grp:not(.lrb):nth-last-child(2){margin-bottom:0}
.grp>.gl:not(.gt){font-size:14px;font-weight:500;color:var(--mute)}
.crit .grp+.grp .gl.gt{margin:0 0 -1px}
.gl{font-size:12px;color:var(--mute);width:100%}
.gl.gt{font:700 15px "Barlow Semi Condensed",sans-serif;color:var(--blue)}
.chip{font:500 14px Barlow,sans-serif;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;min-height:32px}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.rt[aria-pressed=true]{color:#fff}
.chip.nrj[aria-pressed=true],.chip.rt.nrj[aria-pressed=true]{background:#d64545;border-color:#d64545;color:#fff}
.grp .br{flex-basis:100%;height:0}
.chip.ency[aria-pressed=true]{background:var(--r);border-color:var(--r);color:#fff}
.chip.nrj[aria-pressed=true]:disabled{opacity:1;cursor:default}
.chip.OK[aria-pressed=true],.chip.EXC[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
.chip.MB[aria-pressed=true]{background:var(--mb);border-color:var(--mb)}
.chip.B[aria-pressed=true]{background:var(--b);border-color:var(--b);color:#2b2300}
.chip.R[aria-pressed=true]{background:var(--r);border-color:var(--r)}
.chip.NO[aria-pressed=true]{background:var(--no);border-color:var(--no)}
.pd{margin-top:12px;border:1px solid var(--line);border-left:5px solid var(--mute);border-radius:8px;padding:10px 12px}
.pd h3{font:700 15px "Barlow Semi Condensed",sans-serif;margin:0 0 6px}
.pd ul{margin:0;padding-left:18px;font-size:14px;color:var(--mute)}
.pd li.a{color:var(--no);font-weight:600}
.ch{font:700 15px "Barlow Semi Condensed",sans-serif;margin:0}
.auto{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0 10px;font-size:14px}
.auto ul{margin:0 0 6px;padding-left:18px}
.auto p{margin:4px 0}
.bh{font-weight:600;color:var(--blue)}
.empty{color:var(--mute)}
.crit.off{opacity:.65}
.chip:disabled{cursor:not-allowed;opacity:.4}
.invmsg{margin:0 0 10px;padding:8px 12px;border-radius:8px;border:1px solid var(--no);color:var(--no);font-weight:600;font-size:14px}
.microw{display:flex;gap:10px;align-items:center;margin-top:8px}
.micmsg{font-size:13px;color:var(--mute)}
.btn.mic[aria-pressed=true]{background:var(--no);border-color:var(--no);color:#fff}
.dv{margin:0 0 10px}
.dv:empty{display:none}
.dv.on{padding:8px 12px;border:1px dashed var(--blue);border-radius:8px}
.dvm{margin:0 0 6px;font-size:14px}
.dvs{margin:0 0 6px;font-size:13px;color:var(--mute)}
.dv .btn{margin-right:6px}
.vtabs{display:flex;gap:6px;margin-bottom:12px}
.vt{font:600 15px Barlow,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:8px;cursor:pointer}
.vt[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.bar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.bar label{flex:1;min-width:200px}
select{width:100%;font:16px Barlow,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:3px}
[hidden]{display:none!important}
.fin{background:#fff;color:#2a56a8;font:700 14px Barlow,sans-serif;padding:4px 10px;border-radius:999px}
.okc{color:var(--ok);font-weight:600;font-size:14px;align-self:center}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:center;font-size:15px}
th{background:var(--blue);color:#fff;font-weight:600}
td.l{text-align:left}.pend{color:var(--mute)}.nim{color:var(--no)}
.lnk{background:none;border:0;color:var(--blue);font:600 15px Barlow,sans-serif;cursor:pointer;text-decoration:underline;padding:0}
.nt{font-size:20px;margin:0 0 6px}
.gx{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.gx h3{font:700 16px "Barlow Semi Condensed",sans-serif;margin:0 0 8px;color:var(--blue)}
.chk{display:inline-flex;gap:6px;align-items:center;margin-right:16px;font-size:15px;color:var(--ink)}
.chk input{width:auto;margin:0}
.vt[hidden]{display:none}
.jf{font:500 13px Barlow,sans-serif;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;margin:0 6px}
.jf[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.gl{margin:8px 0 0;padding-left:18px}.gl li{margin-bottom:4px}
.of td input{width:84px;margin:0;text-align:center}
.of td.dvs{font-size:12px;text-align:left;vertical-align:top;min-width:150px}
.of td b{font-size:18px}
.opt{display:flex;margin:6px 0;align-items:flex-start}.opt input{margin-top:4px}.tg{margin-bottom:10px}.tg>b{display:block;color:var(--ink)}
.com{padding:0 14px 14px}
@media print{body{background:#fff}.btns,.tabs,.microw,.dv,.vtabs,.bar{display:none}.pane{display:block!important;break-inside:avoid}.sec-card{break-inside:avoid}.wrap{padding:0}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Planilla examinadora · Maniobras</h1>
  <div class="btns">
    <button class="btn sec" id="print">Imprimir / PDF</button>
  </div>
</header>
<div id="csync" class="dvs" role="status" style="text-align:right;margin:2px 0 6px"></div>
<nav class="vtabs"><button class="vt" id="vt-plan" data-view="plan" aria-selected="true">Planilla</button><button class="vt" id="vt-notas" data-view="notas" aria-selected="false">Notas finales</button><button class="vt" id="vt-gestion" data-view="gestion" aria-selected="false">Gestión de Exámenes</button></nav>
<div id="v-plan">
  <div class="bar"><label>Alumno que se evalúa (por dorsal)<select id="sel"></select></label><button class="btn" id="add" hidden>+ Nueva planilla</button><button class="btn sec" id="del" hidden>Eliminar</button></div>
  <div class="id" id="id"></div>
  <main id="main"></main>
</div>
<div id="v-notas" hidden></div>
<div id="v-oficial" hidden></div>
<div id="v-gestion" hidden></div>
<div id="v-crear" hidden></div>
<div id="v-alumnos" hidden></div>
</div>
<script>
const RT=['OK','R','NO'],S5=['NO','R','B','MB','EXC'],LR=['IZQ','DER'];
const isLR=g=>!!g.o&&g.o.length===2&&g.o[0]==='IZQ'&&g.o[1]==='DER';
const SECS=[['n4ci','Feedback Curva Intermedia · Nivel 4'],['n4sp','Feedback Super Paralelo · Nivel 4'],['n4cp','Feedback Corto Paralelo · Nivel 4'],['n4fp','Feedback Fuera de Pista · Nivel 4'],['n4bu','Feedback Bumps · Nivel 4'],['n3cu','Feedback Cuña · Nivel 3'],['n3el','Feedback Elemental · Nivel 3'],['n3cib','Feedback Curva Intermedia Básica · Nivel 3'],['n3ci','Feedback Curva Intermedia · Nivel 3'],['n3sp','Feedback Super Paralelo · Nivel 3'],['n3cp','Feedback Corto Paralelo · Nivel 3'],['n3fp','Feedback Fuera de Pista · Nivel 3'],['n3bu','Feedback Bumps · Nivel 3'],['n2sp','Feedback Super Paralelo · Nivel 2'],['n2cp','Feedback Corto Paralelo · Nivel 2'],['n2cib','Feedback Curva Intermedia Básica · Nivel 2'],['n2fp','Feedback Fuera de Pista · Nivel 2'],['n2bu','Feedback Bumps · Nivel 2'],['n1sp','Feedback Super Paralelo · Nivel 1'],['n1cp','Feedback Corto Paralelo · Nivel 1'],['n1cu','Feedback Cuña · Nivel 1'],['n1el','Feedback Elemental · Nivel 1'],['sp','Feedback Super Paralelo · Nivel 2/3/4'],['cp','Feedback Corto Paralelo · Nivel 2/3/4'],['ci','Feedback Curva Intermedia'],['cu','Feedback Cuña'],['el','Feedback Elemental'],['cib','Feedback Intermedia Básica']];
const PERF=['sp','cp','ci','n2sp','n2cp','n3sp','n3cp','n3ci','n4sp','n4cp','n4ci'];
const FPS=['n2fp','n3fp','n4fp'];
const C=[
 ['interp','Interp. maniobra',[{o:['Sí','No']},{l:'Observaciones',o:['No natural','Estático','Exagerado','Errático']}]],
 ['ritmo','Ritmo',[{r:1,o:RT},{o:['Lento','Alto']},{l:'Velocidad',t:1,r:1,o:RT},{o:['Alta','Baja','Varía']}]],
 ['curva','Diseño curva',[{r:1,o:RT},{o:LR},{l:'Forma',m:1,o:['Arco','Cuerda','Flecha','Irregular','Diagonal']}]],
 ['apoyos','Apoyos',[{r:1,o:S5},{m:1,o:['A Frame','Derrapa','Pivoteos','Inestable']}]],
 ['ejes','Ejes',[{r:1,o:S5},{m:1,o:['Rot.','Inc.','C.Rot']},{m:1,o:['IZQ','DER']}]],
 ['carga','Gestión de carga',[{r:1,o:S5},{m:1,o:['Falta al inicio','Exceso final','Retiene finales','No se adapta','Flotado']}]],
 ['encad','Encadenamiento',[{o:['DIR','IND']},{l:'Frecuencia',o:['A veces','Casi siempre','Siempre']}]],
 ['visual','Ant. visual',[{r:1,o:RT},{m:1,o:['Hacia adentro','A los pies']},{m:1,o:LR}]],
 ['ade','ADE',[{r:1,o:RT},{m:1,o:['AD.','RETR.','TOB.','CAD.','ROD.']}]],
 ['baston','Uso bastón',[{r:1,o:RT},{m:1,o:['Acompaña','Rebota','Ap. circular']}]]
];
const BM=(n)=>[{r:1,o:RT},{m:1,o:n}];
const IMG=n=>['imagen','Imagen gral.',[{r:1,o:S5},{m:1,o:n}]];
const EJB=['ejes','Ejes',[{r:1,o:S5},{m:1,o:['Rot.','Inc.','C.Rot']},{m:1,o:['IZQ','DER']}]];
const ADB=['ade','ADE',[{r:1,o:RT},{m:1,o:['AD.','RETR.','TOB.','ROD.','CAD.']}]];
const VIB=['visual','Ant. visual',[{r:1,o:RT},{m:1,o:['Eje pista','Eje avance','Adentro']}]];
const CU=[IMG(['No natural','En bloque','Forzado']),VIB,
 ['curva','Diseño curva',[{r:1,o:S5},{m:1,o:['Arco','Cuerda','Flecha','Zig zag','Diagonal']}]],
 ['apoyos','Apoyos',[{r:1,o:S5},{m:1,o:['Aplana interno','Pierde cuña','Cuña resistida']},{m:1,o:LR}]],
 ['vel','Velocidad',[{r:1,o:RT},{o:['Alta','Baja','Varía']},{m:1,o:['Exc. rozamiento','C. cortada']}]],
 ADB,EJB,
 ['baston','Uso bastón',BM(['Acompaña','Ap. temprano','Ap. tarde','Ap. circular'])]];
const EL=[IMG(['No natural','En bloque','Forzado']),VIB,
 ['curva','Diseño curva',[{r:1,o:S5},{m:1,o:['Arco','Cuerda','Flecha','No prepara','Diagonal','Confunde fases']}]],
 ['apoyos','Apoyos',[{r:1,o:S5},{m:1,o:['Toma carga int.','Elimina cuña','Deriva lateral']},{m:1,o:LR}]],
 ['vel','Velocidad',[{r:1,o:RT},{o:['Alta','Baja','Varía']},{m:1,o:['Frena cuña','Fin. cortada']}]],
 ADB,EJB,
 ['reunion','Reunión',[{r:1,o:S5},{m:1,o:['Temprana','Tardía','Activa']}]],
 ['baston','Uso bastón',BM(['Acompaña','Ap. finalización','Ap. circular'])]];
const CB=[IMG(['No natural','Estático','Exagerado']),
 ['ritmo','Ritmo',[{r:1,o:RT},{o:['Lento','Alto']}]],
 ['vel','Velocidad',[{r:1,o:RT},{o:['Alta','Baja','Varía']}]],
 ['curva','Diseño curva',[{r:1,o:S5},{m:1,o:['Arco','Cuerda','Flecha','Diagonal']}]],
 ['carga','Gestión de carga',[{r:1,o:S5},{m:1,o:['Falta al inicio','Exceso final','Retiene finales']}]],
 ['apoyos','Apoyos',[{r:1,o:S5},{m:1,o:['A frame','Cortada','Pivoteos']},{m:1,o:LR}]],
 EJB,
 ['encad','Tipo encad.',[{o:['DIR','IND']},{l:'Frecuencia',o:['A veces','Siempre']}]],
 ADB,
 ['visual','Ant. visual',[{r:1,o:RT},{m:1,o:['Adentro','A los pies']}]],
 ['baston','Uso bastón',BM(['Acompaña','Rebota','Ap. circular'])]];
const N2VEL=['ritmo','Ritmo',[{r:1,o:RT},{o:['Lento','Alto']},{l:'Velocidad',t:1,r:1,o:RT},{o:['Alta','Baja','Control']}]];
const N2VIS=['visual','Ant. visual',[{r:1,o:S5},{m:1,o:['Adentro','A los pies','No elige línea']}]];
const N2ADT=['adterr','Ad. terr.',[{r:1,o:RT},{m:1,o:['No anticipa','Reactivo','Miedo','Apoyo Alt.']}]];
const byId=id=>C.find(c=>c[0]===id);
const N2FP=[byId('interp'),N2VEL,byId('curva'),N2VIS,byId('ejes'),byId('carga'),byId('encad'),N2ADT,byId('ade'),byId('baston')];
const N2BU=[byId('interp'),N2VEL,N2VIS,['carga','G. carga',[{r:1,o:S5},{m:1,o:['Pierde contacto','Rebota','Retiene','No se adapta']}]],N2ADT,['estrategia','Estrategia',[{r:1,o:RT},{m:1,o:['Pivot','Derrapaje','Freno','Diag.']}]],byId('ejes'),['apoyos','Apoyos',[{r:1,o:RT},{m:1,o:['A Frame','Alternado','Pivoteos','Inestable']},{m:1,o:LR}]],byId('ade'),['baston','Uso bastón',BM(['Temprano','Tarde','Rebota'])]];
const N2CB=CB.filter(c=>c[0]!=='vel').map(c=>c[0]==='apoyos'?['apoyos','Apoyos',[{r:1,o:S5},{m:1,o:['A Frame','Cortada','Pivoteos']},{m:1,o:LR}]]:c[0]==='ritmo'?['ritmo','Ritmo',[{r:1,o:RT},{o:['Lento','Alto']},{l:'Velocidad',t:1,r:1,o:RT},{o:['Alta','Baja','Varía']}]]:c);
const N1O=['No interpreta','No natural','Estático','Exagerado','Errático'];
const C1=C.map(c=>c[0]==='interp'?IMG(N1O):c);
const C1P=C1.map(c=>c[0]==='carga'?['carga','Gestión de carga',[{r:1,o:S5},{o:c[2][1].o}]]:c[0]==='imagen'?['imagen','Imagen gral.',[{r:1,o:S5},{l:'Observaciones',o:N1O}]]:c[0]==='apoyos'?['apoyos','Apoyos',[{r:1,o:S5},{m:1,o:['A Frame(alt)','Derrapa','Pivoteos','Inestable']}]]:c);
const C1S=C1P.map(c=>c[0]==='apoyos'?C1.find(x=>x[0]==='apoyos'):c);
const N1S=s=>s==='n1cp'||s==='n1sp';
const EL1=EL.map(c=>c[0]==='imagen'?['imagen','Imagen gral.',[{r:1,o:S5},{o:c[2][1].o}]]:c[0]==='visual'?['visual','Ant. visual',[{r:1,o:RT},{o:c[2][1].o}]]:c);
const CU1=CU.map(c=>c[0]==='imagen'?['imagen','Imagen gral.',[{r:1,o:S5},{o:c[2][1].o}]]:c[0]==='visual'?['visual','Ant. visual',[{r:1,o:RT},{o:c[2][1].o}]]:c[0]==='apoyos'?['apoyos','Apoyos',[{r:1,o:S5},{m:1,o:c[2][1].o},c[2][2]]]:c[0]==='vel'?['vel','Velocidad',[{r:1,o:RT},c[2][1],{o:c[2][2].o}]]:c);
const CUL=s=>s==='n1cu'||s==='n3cu',ELL=s=>s==='n1el'||s==='n3el';
const CRITS={cu:CU,el:EL,cib:CB,n1sp:C1S,n1cp:C1P,n1cu:CU1,n1el:EL1,n2cib:N2CB,n2fp:N2FP,n2bu:N2BU,n3cu:CU1,n3el:EL1,n3cib:N2CB,n3fp:N2FP,n3bu:N2BU,n4fp:N2FP,n4bu:N2BU};
const n1=sc=>sc==='n1sp'||sc==='n1cp';
const RL=()=>true;
const critOf=sc=>CRITS[sc]||C;
const nim=p=>(st.v[`${p}.interp.0`]||[]).includes('No')||(n1(p.split('.')[0])&&(st.v[`${p}.imagen.1`]||[]).includes('No interpreta'));
const secTitle=(s,t)=>n1(s)?t.replace('Nivel 2/3/4','Nivel 1'):t;
const KEY='planilla_n3_v1';
const KEY2='planillas_n3_v2';

function parseCSV(t){
  t=t.replace(/^﻿/,'');
  const first=t.split(/\r?\n/)[0]||'';
  let del=',',best=1;[';','\t',','].forEach(d=>{const c=first.split(d).length;if(c>best){best=c;del=d}});
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'&&t[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
    else if(c==='"')q=true;
    else if(c===del){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function rowsToAlu(rows){

  if(!rows.length)return[];
  const h=rows[0].map(nz),hdr=h.some(x=>/alumn|apellido|nombre|dorsal|numero|nro/.test(x));
  let iN=0,iD=1,iAp=-1,iNo=-1;
  if(hdr){
    iAp=h.findIndex(x=>/^apellidos?$/.test(x));iNo=h.findIndex(x=>/^nombres?$/.test(x));
    const full=h.findIndex(x=>/alumn|apellido y nombre|nombre y apellido|nombre completo/.test(x));
    iD=h.findIndex(x=>/dorsal|numero|nro/.test(x));
    iN=full>=0?full:((iAp>=0||iNo>=0)?-1:0);
    rows=rows.slice(1);
  }
  return rows.map(r=>({n:(iN>=0?r[iN]||'':[r[iAp],r[iNo]].filter(Boolean).join(' ')).trim().slice(0,80),d:(iD>=0?r[iD]||'':(hdr?'':r[1]||'')).slice(0,10)})).filter(a=>a.n);
}

const t2=m=>Math.floor(m*100+1e-9)/100;
function protocolo(notes,b){
  const n=notes.length;
  if(n<2)return{err:'Faltan notas: la mesa debe ser de 2, 3 o 5 miembros'};
  if(n===4)return{err:'Mesa de 4 no permitida: agregar o quitar un profesor'};
  if(n>5)return{err:'Mesa no prevista (más de 5 miembros)'};
  let a=[...notes].sort((x,y)=>x-y);const p=[];let f;
  if(n===5){p.push(`Se eliminan la nota más baja (${a[0]}) y la más alta (${a[4]})`);a=a.slice(1,4)}
  if(a.length===2){
    const m=(a[0]+a[1])/2;
    if(m>=b){f=t2(m);p.push(`Promedio de ${a.join(' y ')} = ${f}`)}
    else{f=Math.floor(m/5)*5;p.push(`Promedio de ${a.join(' y ')} = ${t2(m)}; reprobado, se redondea hacia abajo a ${f}`)}
  }else{
    const ap=a.filter(x=>x>=b).length;let u=a;
    if(ap===1){u=a.slice(0,2);p.push(`Dos desaprueban y uno aprueba: se elimina la nota alta (${a[2]})`)}
    else if(ap===2){u=a.slice(1);p.push(`Dos aprueban y uno desaprueba: se elimina la nota baja (${a[0]})`)}
    else p.push(ap===3?'Unanimidad aprobada':'Unanimidad desaprobada');
    f=t2(u.reduce((x,y)=>x+y,0)/u.length);p.push(`Promedio de ${u.join(', ')} = ${f}`);
  }
  return{f,ok:f>=b,p};
}
function ofData(){

  const add=(n,d,l)=>{const k=nz(n||'');if(!k||seen.has(k))return;seen.add(k);alu.push({k,n:n.trim(),d:d||'',l:l||''})};
  DB.ex.alu.forEach(a=>add(a.n,a.d,DB.ex.lugar));
  DB.list.forEach(x=>{if(!DB.ex.alu.length||inEx(x.st.h.alumno))add(x.st.h.alumno,x.st.h.dorsal,x.st.h.deleg)});
  const mem=DB.ex.exam.slice();
  DB.list.forEach(x=>{const p=x.st.h.prof;if(p&&!mem.includes(p))mem.push(p)});
  return{alu,mem};
}
function ofAuto(k,sc,m){
  for(const x of DB.list){if(nz(x.st.h.alumno||'')===k&&x.st.h.prof===m){const v=best(x.st,sc);if(v!==null)return v}}
  const c=(DB.conf||{})[fk(m)],v=c&&c[fk(k)]&&c[fk(k)][sc];
  return v===undefined||v===null?null:(v==='NIM'?'NIM':Number(v));
}
function ofVal(k,sc,m){
  const a=ofAuto(k,sc,m);
  return a;
}
function ofRes(k,sc,mem){
  const e=mem.map(m=>[m,ofVal(k,sc,m)]).filter(x=>x[1]!==null),nim=e.filter(x=>x[1]==='NIM');
  if(nim.length)return['<b class="nim">NIM</b>',`No interpreta la maniobra (${esc(nim.map(x=>x[0]).join(', '))}): no se promedia y pasa directamente como resultado.`];
  const r=protocolo(e.map(x=>x[1]),baseFor(sc));
  if(r.err)return['<span class="pend">—</span>',`<span class="pend">${esc(r.err)}</span>`];
  return[`<b class="${r.ok?'':'nim'}">${r.f}</b> <span class="${r.ok?'okc':'nim'}">${r.ok?'Aprobado':'Reprobado'}</span>`,esc(r.p.join('. '))+'.'];
}

  const msg=t=>{const m=document.getElementById('fmsg');if(m)m.textContent=t};
  if(!DB.me||DB.adm)return;
  if(!DB.of.hab){msg('El jefe de mesa aún no habilitó las firmas.');return}
  const p=(document.getElementById('fpw')||{}).value||'';if(!LOCAL&&!p){msg('Escribe tu contraseña.');return}
  if(!LOCAL)try{await fbAuth('signInWithPassword',{email:CL.email,password:p,returnSecureToken:true})}catch(e){msg(e&&e.code!==undefined?'Contraseña incorrecta.':'Para firmar necesitás conexión a internet.');return}
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  DB.of.fir[DB.me]={fp:ofFp(),at:`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
  save();renderOficial();
}
function renderOficial(){
  const el=document.getElementById('v-oficial'),{alu,mem}=ofData(),B=OFB();
  let body;
  if(!alu.length)body='<p class="dvs">Aún no hay alumnos. Cárgalos en Gestión de Exámenes o crea planillas.</p>';
  else if(!mem.length)body='<p class="dvs">Aún no hay examinadores. Cárgalos en Gestión de Exámenes.</p>';
  else body=alu.map((a,i)=>`<div class="gx of"><h3>${esc(a.n)}${a.d?' · dorsal '+esc(a.d):''}${a.l?' · '+esc(a.l):''}</h3><div class="tw"><table><thead><tr><th rowspan="2"></th>${OFG().map(([n,c])=>`<th colspan="${c}">${n}</th>`).join('')}</tr><tr>${B.map(([k,t])=>`<th>${t}</th>`).join('')}</tr></thead><tbody><tr><td class="l"><b>Nota promediada</b></td>${B.map(([sc])=>`<td id="res-${i}-${sc}">${ofRes(a.k,sc,mem)[0]}</td>`).join('')}</tr></tbody></table></div></div>`).join('');
  el.innerHTML=`<button class="btn sec" data-view="gestion">← Volver a ${secName()}</button><h2 class="nt" style="margin-top:10px">Planilla oficial</h2>
  <p class="dvm"><b>La planilla oficial no puede ser modificada por nadie.</b> Las notas surgen de las planillas que confirmó cada examinador.</p>
  <p class="dvs">Cada miembro de la mesa aporta la nota más alta de sus dos bajadas (de su planilla confirmada en este dispositivo). <b>NIM</b> significa No interpreta la maniobra: no tiene nota, no se promedia y pasa directamente como resultado.</p>
  <div class="gx"><p class="dvm">Nota base: <b>${baseTxt(tipoOf()[3])}</b> (según protocolo)</p>
  <details style="margin-top:10px"><summary>Protocolo aplicado</summary><ul class="gl"><li><b>Mesa de 2:</b> se promedian las dos notas. Si el promedio aprueba, se conserva exacto; si no, se redondea hacia abajo de 5 en 5 (37.5 pasa a 35).</li><li><b>Mesa de 3:</b> si dos desaprueban y uno aprueba, se elimina la nota alta y se promedian las otras dos. Si dos aprueban y uno desaprueba, se elimina la baja y se promedian las otras dos. Si hay unanimidad, se promedian las tres.</li><li><b>Mesa de 4:</b> no permitida. Hay que agregar o quitar un profesor.</li><li><b>Mesa de 5:</b> se eliminan la nota más alta y la más baja, y con las tres restantes se aplica la regla de la mesa de 3.</li><li>Los promedios aprobados se muestran con hasta 2 decimales, sin redondear hacia arriba (41.66).</li></ul></details></div>${pendTxt()}${body}${firmasHtml()}`;
}
let CURV='gestion';
const hasEx=()=>!!DB.xid&&DB.ex.exam.length>0&&!!DB.ex.creado;
const secName=()=>(DB.me&&!DB.adm&&!DB.dir)?'Mis Exámenes':'Gestión de Exámenes';
function updTabs(){const g=document.getElementById('vt-gestion');if(g)g.textContent=secName()+(isJefe()&&propOf()?' ●':'');['vt-plan','vt-notas'].forEach(i=>{const t=document.getElementById(i);if(t)t.hidden=!hasEx()||DB.dir})}
function showView(v){
  if((v==='plan'||v==='notas')&&!(v==='plan'&&PV&&isMgr())&&(!hasEx()||DB.dir))v='gestion';
  updTabs();
  if(noAccess()&&v!=='gestion')v='gestion';
  if(v!=='gestion')delAsk=false;
  if(locked()&&!DB.dir&&v!=='gestion')v='gestion';
  if(v==='crear'&&(!isMgr()||!DB.xid||DB.ex.fin||(dirLocked()&&!DB.liveEx)))v='gestion';
  if(v==='alumnos'&&!canAlu())v='gestion';
  if(v==='oficial'&&!DB.adm&&!DB.dir&&!(DB.me&&ofData().mem.includes(DB.me)))v='gestion';
  if(v!=='plan'&&PV)restorePv();
  CURV=v;
  document.getElementById('v-plan').hidden=v!=='plan';
  document.getElementById('v-notas').hidden=v!=='notas';
  document.getElementById('v-oficial').hidden=v!=='oficial';
  document.getElementById('v-gestion').hidden=v!=='gestion';
  document.getElementById('v-crear').hidden=v!=='crear';
  document.getElementById('v-alumnos').hidden=v!=='alumnos';
  document.getElementById('vt-plan').setAttribute('aria-selected',String(v==='plan'));
  document.getElementById('vt-notas').setAttribute('aria-selected',String(v==='notas'));
  document.getElementById('vt-gestion').setAttribute('aria-selected',String(v==='gestion'||v==='oficial'||v==='crear'||v==='alumnos'));
  if(v==='notas')renderNotas();
  if(v==='gestion'||v==='crear'||v==='alumnos')renderGestion();
  if(v==='oficial')renderOficial();
  if(v==='plan'){syncPl();bar();all()}
}
function switchTo(id){
  const e=DB.list.find(x=>x.id===id);if(!e)return;
  if(DI&&DI.active&&DI.active())DI.stop();stopRec();
  DB.cur=id;st=e.st;tab={};Object.keys(dv).forEach(k=>delete dv[k]);
  save();showView('plan');all();
}
document.getElementById('add').onclick=()=>{const id='p'+Date.now();DB.list.push({id,st:mine()});switchTo(id)};
document.getElementById('sel').onchange=e=>switchTo(e.target.value);
document.getElementById('del').onclick=()=>{
  if(!confirm('¿Eliminar la planilla de este alumno? No se puede deshacer.'))return;
  DB.list=DB.list.filter(x=>x.id!==DB.cur);
  if(!DB.list.some(vis))DB.list.push({id:'p'+Date.now(),st:mine()});
  switchTo(DB.list.find(vis).id);
};
if(LOCAL){if(DB.me&&DB.me!==SINASIG&&!mineIds().length)DB.me='';DB.adm=!DB.me;DB.admName=DB.adm?'Administrador (modo local)':'';if(DB.me)useEx(pickMine());else if(!DB.xid)useEx(pickNext())}else if(cLoad()){DB.dir=CL.role==='dir';DB.adm=CL.role==='admin';DB.me=(DB.adm||DB.dir)?'':CL.name;DB.admName=(DB.adm||DB.dir)?CL.name:'';if(DB.me)useEx(pickMine());else if(!DB.xid)useEx(pickNext());cStart()}else{DB.adm=false;DB.me='';DB.admName=''}
updTabs();if(locked()||DB.dir||!hasEx()||noAccess())showView('gestion');else{syncPl();saveLocal();all()}
(async()=>{
  try{DI=await claude.use('dictation')}catch(e){}
  try{SM=await claude.use('sample')}catch(e){}
  if(DI){
    DI.onFinal(({text})=>{
      if(!tgt)return;
      if(tgt.p){const d=dv[tgt.p];if(d&&d.st==='listen'){d.text=(d.text||'')+((d.text||'')?text:text.trimStart());d.partial='';showDv(tgt.p)}}
      else{
        const cur=st.c[tgt.s]||'';
        st.c[tgt.s]=cur+(cur?((/\s$/.test(cur)||/^\s/.test(text))?'':' ')+text:text.trimStart());
        const el=document.querySelector(`textarea[data-c="${tgt.s}"]`);if(el)el.value=st.c[tgt.s];save();
      }
    });
    DI.onPartial(({text})=>{if(tgt&&tgt.p&&dv[tgt.p]&&dv[tgt.p].st==='listen'){dv[tgt.p].partial=text;showDv(tgt.p)}});
    DI.onState(({state,reason})=>{
      if(tgt&&tgt.s){
        const b=document.querySelector(`[data-mic="${tgt.s}"]`),on=state!=='idle';
        if(b){b.textContent=on?'⏹️ Detener':'🎙️ Dictar';b.setAttribute('aria-pressed',String(on))}
        micMsg(tgt.s,on?'Escuchando…':'');
      }
      if(state!=='idle'||!tgt||!tgt.p)return;
      const p=tgt.p,d=dv[p];if(!d||d.st!=='listen')return;
      const bad={not_granted:'No hay permiso para usar el micrófono.',unavailable:'El dictado no está disponible en este navegador.',rate_limited:'Demasiados dictados a la vez. Intenta en unos segundos.',upstream_error:'Falló el micrófono o el servicio de voz.'};
      if(bad[reason])dv[p]={st:'err',msg:bad[reason]};
      else if((d.text||'').trim()){if(d.mode==='cmd'){d.prop=parseCmd(d.text,p);d.st='review'}else{interpret(p);return}}
      else dv[p]={st:'idle'};
      showDv(p);
    });
  }
  if(DI)all();
})();
all();
</script>
