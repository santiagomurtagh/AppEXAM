async function auth(ep,body){let r;try{r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+ep+'?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw {net:true}}
  const j=await r.json().catch(()=>({}));if(!r.ok){const c=(j.error&&j.error.message)||'ERROR';throw {code:c}}return j}
async function token(){
  if(S.tok&&Date.now()<S.exp-60000)return S.tok;
  let r;try{r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(S.rt)})}catch(e){throw {net:true}}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const c=(j.error&&j.error.message)||'';if(/TOKEN_EXPIRED|USER_DISABLED|USER_NOT_FOUND|INVALID_REFRESH_TOKEN/.test(c))throw {auth:true};throw {net:true}}
  S.tok=j.id_token;S.rt=j.refresh_token||S.rt;S.exp=Date.now()+Number(j.expires_in||3600)*1000;save();return S.tok}
async function rest(method,path,body,q){
  const t=await token();let r;
  try{r=await fetch(FB.db+'/'+path+'.json?'+(q?q+'&':'')+'auth='+encodeURIComponent(t),{method,headers:body!==undefined?{'Content-Type':'application/json'}:undefined,body:body!==undefined?JSON.stringify(body):undefined})}catch(e){throw {code:'unavailable'}}
  if(r.status===401||r.status===403)throw {code:'permission_denied'};
  if(!r.ok)throw {code:'unavailable'};
  try{return await r.json()}catch(e){return null}}

function map(p){const a=p.split('/');if(a[0]!=='envios')throw {code:'invalid_argument'};
  if(a.length===1)return NODE;
  if(a.length===2)return NODE+'/'+a[1]+'/meta';
  return NODE+'/'+a.slice(1).join('/')}

const polls=new Set();let memo=null;
const kick=()=>{memo=null;polls.forEach(f=>f())};
async function fullNode(){if(memo&&Date.now()-memo.t<4000)return memo.v;const v=(await rest('GET',NODE))||{};memo={t:Date.now(),v};return v}

function collection(p){return {doc:i=>doc(p+'/'+i),onSnapshot(next,err){
  let dead=false,busy=false;
  const run=async()=>{if(dead||busy)return;busy=true;
    try{let o;const a=p.split('/');
      if(a.length===1){o=Object.fromEntries(Object.keys(await fullNode()).map(k=>[k,{by:k}]))}
      else if(a.length===3&&a[2]==='items'&&isOwner()){const n=await fullNode();o=(n[a[1]]&&n[a[1]].items)||{}}
      else o=(await rest('GET',map(p)))||{};
      if(!dead)next(snap(o))}
    catch(e){if(!dead&&err)err(e&&e.code?e:{code:'unavailable'})}
    busy=false};
  polls.add(run);run();const iv=setInterval(()=>{if(!document.hidden)run()},8000);
  return ()=>{dead=true;clearInterval(iv);polls.delete(run)}}}}
function doc(p){return {id:p.split('/').pop(),path:p,
  async set(d){try{await rest('PUT',map(p),JSON.parse(JSON.stringify(d)))}catch(e){throw e}kick()},
  async delete(){await rest('DELETE',map(p));kick()},
  collection:c=>collection(p+'/'+c)}}
const names={};

async function finish(em,code){

  try{localStorage.removeItem(PEND)}catch(e){}cleanUrl();enter()}
async function enterAnon(em){
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))throw {code:'INVALID_EMAIL'};
  if(!(S.anon&&S.rt)){const j=await auth('signUp',{returnSecureToken:true});S.tok=j.idToken;S.rt=j.refreshToken;S.exp=Date.now()+Number(j.expiresIn||3600)*1000;S.uid=j.localId;S.anon=true}

  return '\uFEFF'+[H.map(q).join(',')].concat(gs.map(g=>{const m=byK[g.k];return [m?m.name:g.k,m?m.lvl:'',g.n,g.nn,g.ppl,g.med==null?'':g.med,g.mn==null?'':g.mn,g.mx==null?'':g.mx,gState(g)[0],g.bases.join(' / '),g.hit,g.nim,resLines(g.ex).join(' | ')].map(q).join(',')})).join('\r\n')}
function csvRes(rows){const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const H=['Fecha','Maniobra','Nivel','Examen','Base','Resultado','Nota sugerida','Combinaciones cumplidas','Comentario','Enviado por','Marcas'];
  return '﻿'+[H.map(q).join(',')].concat(rows.map(x=>{const m=byK[x.k];return [new Date(x.ts).toISOString(),m?m.name:x.k,x.lvl,x.exn,x.base,resTxt(x),x.nota==null?'':x.nota,(x.cumple||[]).map(c=>c.n+'. '+c.t).join(' | '),x.coment,who(x.by),resLines(x).join(' | ')].map(q).join(',')})).join('\r\n')}
let cur='ini';
const MY={started:false,items:[],err:'',loaded:false,raf:0};
function startMy(){if(MY.started||!DBX||!UX)return;MY.started=true;
  (async()=>{try{const uid=await UX.id();if(!uid)throw {code:'sin_id'};
    DBX.collection('envios/'+uid+'/items').onSnapshot(q=>{MY.items=q.docs.map(x=>Object.assign({id:x.id},x.data()));MY.loaded=true;MY.err='';schedMy()},e=>{MY.err='No se pudieron leer tus simulaciones ('+(e&&e.code)+').';schedMy()})}
  catch(e){MY.err='No se pudo identificar tu usuario.';MY.started=false;schedMy()}})()}
function schedMy(){if(cur!=='ini')return;cancelAnimationFrame(MY.raf);MY.raf=requestAnimationFrame(render)}
function vMy(){
  startMy();
  if(!DBX||!UX)return `<div class="panel"><h3>Mis Simulaciones</h3><p class="none">Cargando tus simulaciones…</p></div>`;
  const it=MY.items,n=it.length,last=n?Math.max(...it.map(x=>x.ts||0)):0;
  const byL=[1,2,3,4].map(l=>[l,it.filter(x=>x.lvl===l).length]);
  return `<div class="panel"><h3>Mis Simulaciones</h3><p>Las pruebas que enviaste desde Simular Examen, por nivel.${last?' La última fue el '+esc(fdate(last)).replace(/\.$/,'')+'.':''}</p>${MY.err?`<p class="none" role="status">${esc(MY.err)}</p>`:''}${!MY.loaded&&!MY.err?'<p class="none" role="status">Cargando…</p>':''}<div class="stats"><div class="stat"><b>${n}</b><span>en total</span></div>${byL.map(([l,c])=>`<div class="stat"><b>${c}</b><span>Nivel ${l}</span></div>`).join('')}</div></div>`}
function vIni(){
  const go=(v,ti,tx)=>`<button class="go" data-go="${v}"><b>${ti}</b><span>${tx}</span></button>`;
  return `<div class="dev" role="note"><span class="tag">En desarrollo</span><p>Esta herramienta está en desarrollo. Se utilizará para generar una base de datos que permita que todos los exámenes sean bien objetivos.</p></div>
  <div class="panel"><h2>Para qué sirve esta herramienta</h2><p>Reúne las notas que proponen examinadores para distintas combinaciones de criterios de la planilla de AppEXAM. Con esos datos se podrá armar una escala de valores que relacione cada combinación con una nota.</p><p class="lvlnote"><b>Cada nivel tiene su propia escala de valores.</b> Las notas de un nivel no se mezclan con las de otro: se analizan y se arman por separado.</p></div>
  <div class="panel"><h3>Cómo se usa Simular Examen</h3><ol class="steps"><li>Elegí el examen y la maniobra.</li><li>Completá cada criterio: todas sus calificaciones y al menos una observación. El siguiente criterio aparece cuando terminás el actual.</li><li>Elegí una Nota Sugerida de 0 a 100, de 5 en 5, y agregá un comentario si querés.</li><li>Tocá Guardar y Enviar. Si la nota supera lo que indican las reglas, se muestra un aviso, pero igual podés enviarla.</li></ol><p class="note">Lo que enviás lo ve solo el administrador de esta herramienta.</p></div>
  <div class="gos">${go('bas','Bases de aprobación','La nota base de cada examen y las combinaciones que sugieren una nota menor que la base, maniobra por maniobra.')}${go('esc','Prueba de escala','La planilla de cada maniobra tal como funciona en AppEXAM, con opciones bloqueadas, para ver qué resultado da cada marca.')}${go('sim','Simular Examen','Elegís un examen y completás sus criterios de a uno. Podés sugerir una nota y enviarla con un comentario.')}${OWN?go('res','Resultados enviados','Lo que enviaron los integrantes del Comité Técnico, agrupado por combinación. Solo lo ve el administrador.'):''}</div>
  `+vMy()}

function trigOf(m){
  const has=id=>m.crit.some(c=>c.id===id),CUL=m.name==='Cuña',ELL=m.name==='Elemental',N1S=m.k==='n1cp'||m.k==='n1sp',T=[];
  const add=(cells,extra)=>T.push(Object.assign({cells},extra||{}));
  if(CUL||ELL)add([{c:'imagen',i:0,o:['NO']}]);
  else if(N1S&&has('imagen'))add([{c:'imagen',i:0,o:['NO']}],{art:true});
  if(ELL)add([{c:'curva',i:1,o:['Confunde fases']}]);
  if(has('interp'))add([{c:'interp',i:0,o:['No']}]);
  const rt=m.crit.reduce((n,c)=>n+c.gs.filter(g=>g.sc).length,0);
  add([],{r:true,need:Math.floor(rt/2)+1,rt});
  if(has('encad'))add(N1S?[{c:'encad',i:0,o:['IND']},{c:'encad',i:1,o:['Casi siempre','Siempre']}]:[{c:'encad',i:0,o:['IND']}]);
  if(has('ritmo')&&has('curva'))add([{c:'ritmo',i:0,o:['NO']},{c:'curva',i:0,o:['NO']}]);
  if(has('apoyos'))add([{c:'apoyos',i:0,o:['NO']}]);
  if(has('ejes'))add([{c:'ejes',i:0,o:['NO']}]);
  T.forEach((x,i)=>x.n=i+1);return T}
function sheet(m){
  const T=trigOf(m),mark={},rmaj=T.find(x=>x.r);
  T.forEach(x=>x.cells.forEach(cl=>cl.o.forEach(o=>{const k=cl.c+'.'+cl.i+'.'+o;(mark[k]=mark[k]||[]).push(x.n)})));
  const gi={};T.forEach(x=>x.cells.forEach(cl=>{(gi[cl.c]=gi[cl.c]||new Set([0])).add(cl.i)}));
  const crit=m.crit.slice();
  const chip=(c,i,o,sc)=>{const k=c.id+'.'+i+'.'+o,ns=mark[k];const rm=rmaj&&sc&&o==='R';
    return `<span class="sc${ns?' tg':''}${rm?' rm':''}"${ns?` title="Combinación ${ns.join(', ')}"`:rm?' title="Cuenta para «R en la mayoría»"':''}>${esc(o)}${ns?`<i>${ns.join(',')}</i>`:''}</span>`};
  const rows=crit.map(c=>{const idx=[...(gi[c.id]||[0])].sort((a,b)=>a-b);
    const gs=idx.map(i=>{const g=c.gs[i];if(!g)return '';const opts=g.sc?SC[g.sc]:g.o;
      return `<span class="sg">${idx.length>1&&g.l?`<em>${esc(g.l)}</em>`:''}${opts.map(o=>chip(c,i,o,!!g.sc)).join('')}</span>`}).join('');
    return `<div class="sr"><b>${esc(CN[c.id])}</b><div>${gs}</div></div>`}).join('');
  const lab=cl=>{const c=m.crit.find(z=>z.id===cl.c),g=c&&c.gs[cl.i];return `<span class="sc tg">${esc(CN[cl.c])}${g&&g.l&&cl.i?' · '+esc(g.l):''}: ${cl.o.map(esc).join(' o ')}</span>`};
  const leg=T.map(x=>`<div class="cb"><span class="nb">${x.n}</span>${x.r?`<span class="sc rm">R en al menos ${x.need} de ${x.rt} casillas de calificación</span>`:x.cells.map(lab).join('<span class="plus">+</span>')}${x.art?'<span class="art" title="Regla aplicada solo en esta herramienta; en AppEXAM todavía no rige para esta maniobra">solo en esta herramienta</span>':''}</div>`).join('');
  return `<div class="sheet"><div class="sh">${rows}</div><div class="cbs"><h4>Se sugiere una nota menor que la base con cualquiera de estas combinaciones</h4>${leg}<p class="note">Los valores en rojo de la planilla forman parte de una combinación; el número indica cuál. «+» significa que deben darse a la vez; los valores con borde punteado cuentan para «R en la mayoría».</p></div></div>`}
function rulesOf(m){
  const has=id=>m.crit.some(c=>c.id===id),CUL=m.name==='Cuña',ELL=m.name==='Elemental',N1S=m.k==='n1cp'||m.k==='n1sp';
  const opt=(id,i,o)=>{const c=m.crit.find(z=>z.id===id);return !!c&&!!c.gs[i]&&c.gs[i].o.includes(o)};
  const pd=[],nim=[],bl=[];
  if(CUL||ELL)pd.push('Imagen general en NO.');
  if(N1S&&has('imagen'))pd.push('Imagen general en NO. (Regla aplicada solo en esta herramienta: en AppEXAM todavía no rige para esta maniobra.)');
  if(ELL)pd.push('Diseño de curva con «Confunde fases».');
  if(has('interp'))pd.push('Interpretación marcada en No.');
  pd.push('R en la mayoría de las casillas de evaluación.');
  if(has('encad'))pd.push(N1S?'Encadenamiento indirecto (IND) con frecuencia «Casi siempre» o «Siempre».':'Encadenamiento indirecto (IND).');
  if(has('ritmo')&&has('curva'))pd.push('Ritmo y Diseño de curva, ambos en NO.');
  if(has('apoyos')&&has('ejes'))pd.push('Apoyos o Ejes en NO.');else if(has('apoyos'))pd.push('Apoyos en NO.');else if(has('ejes'))pd.push('Ejes en NO.');
  const tr=[N1S&&has('imagen')&&'«No interpreta» en Imagen gral.',has('interp')&&'No en Interpretación'].filter(Boolean);
  if(tr.length)nim.push('Se activa con '+tr.join(' o con ')+': la bajada queda sin nota y los demás criterios no cuentan para la nota.');else nim.push('Esta maniobra no tiene criterio de interpretación, así que no se activa NIM.');
  if(has('curva')&&!ELL)nim.push('Con Diagonal en Diseño de curva, la app sugiere «No interpreta la maniobra».');
  const cn=[has('ritmo')&&'Ritmo',has('curva')&&'Diseño de curva'].filter(Boolean);
  if(cn.length&&tr.length)nim.push('Con NIM, '+cn.join(' y ')+(cn.length>1?' no pueden':' no puede')+' quedar en OK.');
  if(has('apoyos'))bl.push('Apoyos en MB o EXC: no se marcan observaciones de apoyos.');
  if(has('apoyos')&&has('carga'))bl.push('Apoyos en R o NO: la calificación de Gestión de carga solo puede ser R o NO.');
  if(has('curva')){
    if(ELL){bl.push('Con «Confunde fases», Diseño de curva no puede calificarse B, MB ni EXC.');bl.push('Con «No prepara», Diseño de curva no puede calificarse B, MB ni EXC y no se marcan otras observaciones.')}
    bl.push('Con Diagonal, el resto de las observaciones de curva queda bloqueado y la calificación solo puede ser '+(ELL?'NO o R.':'NO.'));
    if(CUL||ELL)bl.push('Diseño de curva en MB o EXC: no se marcan observaciones de curva.')}
  if(has('ejes')){
    bl.push('Con detalles de ejes marcados, la calificación posible depende del nivel del examen (Nivel 1: NO, R o B · Nivel 2: NO o R · Niveles 3 y 4: NO).');
    if(ELL)bl.push('En Elemental, primero se califica Ejes y después se marcan los detalles.');
    if(CUL||ELL)bl.push('Ejes en MB o EXC: no se marca la tercera observación de ejes.')}
  if(has('vel')&&!ELL&&opt('vel',1,'Varía'))bl.push('«Varía» en Velocidad solo se marca con calificación R o NO.');
  if(CUL&&has('vel'))bl.push('Con Velocidad en R o NO no pueden marcarse a la vez «Alta» y «Exc. rozamiento».');
  if((CUL||ELL)&&has('vel'))bl.push('Velocidad en OK: no se marcan observaciones adicionales de velocidad.');
  if((CUL||ELL)&&has('imagen'))bl.push('Imagen gral. en MB o EXC: no se marcan observaciones de imagen.');
  if(N1S&&has('imagen'))bl.push('Imagen gral. en NO: no se marcan observaciones de imagen.');
  if(N1S&&has('carga'))bl.push('Gestión de carga en MB o EXC: no se marcan observaciones de carga.');
  if(ELL&&has('reunion'))bl.push('Reunión en MB o EXC: no se marcan observaciones de reunión.');
  if(ELL&&has('baston'))bl.push('Uso bastón en OK: no se marcan observaciones de bastón.');
  const ok=[has('visual')&&'Ant. visual',has('ade')&&'ADE',has('baston')&&!ELL&&'Uso bastón'].filter(Boolean);
  if(ok.length)bl.push('Con OK en '+ok.join(', ')+': no se marcan observaciones de ese criterio.');
  return {pd,nim,bl}}
function vBas(){
  let h=`<div class="panel"><h2>Bases de aprobación por nivel</h2><p>Nota base de cada examen y de cada maniobra. Una nota por debajo de la base es una nota desaprobatoria.</p></div>`;
  [1,2,3,4].forEach(l=>{
    const ex=D.tipos.filter(x=>x.id.slice(1)===String(l)).sort((a,b)=>(a.grupo==='Ingreso')-(b.grupo==='Ingreso'));
    h+=`<div class="tw"><table><thead><tr><th colspan="3">Nivel ${l}</th></tr><tr><th>Examen</th><th>Base</th><th>Maniobras</th></tr></thead><tbody>`;
    if(!ex.length)h+=`<tr><td colspan="3" class="none">No hay exámenes cargados para este nivel.</td></tr>`;
    ex.forEach(x=>{
      const ms=x.man.map(k=>byK[k]).filter(Boolean),bs=[...new Set(ms.map(m=>baseOf(m,x)))];
      const cell=ms.map(m=>`<span class="chip">${esc(m.name)}${bs.length>1?' · '+baseOf(m,x):''}</span>`).join('');
      h+=`<tr><td class="nm">${esc(x.nombre)}<small>${esc(x.grupo)}</small></td><td><b class="bn">${bs.length>1?bs.join(' / '):bs[0]}</b></td><td>${cell}${x.nota?`<div class="note" style="margin-top:6px">${esc(x.nota)}</div>`:''}</td></tr>`});
    h+=`</tbody></table></div>`;
    const mm=[...new Set(ex.flatMap(x=>x.man))].map(k=>byK[k]).filter(Boolean);
    h+=`<div class="rules"><h3>Reglas por maniobra · Nivel ${l}</h3>`+mm.map(m=>{const R=rulesOf(m),li=a=>`<ul>${a.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
      return `<details class="rl"><summary>${esc(m.name)}<small>${trigOf(m).length} combinaciones que bajan la nota</small></summary><div class="rg">${sheet(m)}<details class="rl2"><summary>Otras reglas: NIM y opciones bloqueadas</summary><h4>NIM (no interpreta la maniobra)</h4>${li(R.nim)}<h4>Opciones que se bloquean</h4>${li(R.bl)}</details></div></details>`}).join('')+`</div>`});
  return h+`<p class="note">Cuando un examen tiene bases distintas según la maniobra, cada maniobra muestra su propia base.</p>`}
function render(){const v=document.getElementById('v');const fr=cur==='sim';if(ES.free!==fr){ES.free=fr;ES.msg='';ES.v={};ES.vs={};ES.skip=new Set();ES.com='';ES.nota=''}
 v.innerHTML={ini:vIni,sim:vEsc,crit:vCrit,esc:vEsc,cmp:vCmp,bas:vBas,res:vRes}[cur]();
 document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===cur));
 [['rf-k','k'],['rf-l','l'],['rf-h','h']].forEach(([id,k])=>{const el=document.getElementById(id);if(el)el.onchange=()=>{RES.f[k]=el.value;render()}});
 const se=document.getElementById('se'),sx=document.getElementById('sx');if(sx)sx.onchange=()=>{ES.ex=sx.value;ES.vs={};ES.v={};ES.skip=new Set();ES.msg='';ES.com='';ES.nota='';const e=D.tipos.find(x=>x.id===ES.ex);ES.k=e.man.find(k=>byK[k])||ES.k;render()};const sf=document.getElementById('sf');if(sf)sf.onchange=()=>{TAB.f=sf.value;render()}}
document.addEventListener('click',e=>{const t=e.target.closest('.tab');if(t){cur=t.dataset.v;try{history.replaceState(null,'','#'+cur)}catch(_){}render();return}
 const sv=e.target.closest('.sv');if(sv){if(sv.disabled)return;const k=sv.dataset.k,x=sv.dataset.x,cur=ES.v[k]||[];if(cur.includes(x)){const r=cur.filter(y=>y!==x);if(r.length)ES.v[k]=r;else delete ES.v[k]}else ES.v[k]=sv.dataset.m==='1'?cur.concat(x):[x];render();return}
 if(e.target.closest('[data-send]')){sendRes();return}
 if(e.target.closest('[data-csvg]')){if(DLX){const f=RES.f,rows=allRes().filter(x=>(!f.k||x.k===f.k)&&(!f.l||String(x.lvl)===f.l)&&(!f.h||(f.h==='nim'?x.nim:f.h==='hit'?(x.hit&&!x.nim):(!x.hit&&!x.nim))));DLX.save({filename:'resumen-combinaciones-'+new Date().toISOString().slice(0,10)+'.csv',data:csvGrp(groupsOf(rows))}).catch(()=>{})}return}
 if(e.target.closest('[data-csv]')){if(DLX){const f=RES.f,rows=allRes().filter(x=>(!f.k||x.k===f.k)&&(!f.l||String(x.lvl)===f.l)&&(!f.h||(f.h==='nim'?x.nim:f.h==='hit'?(x.hit&&!x.nim):(!x.hit&&!x.nim))));DLX.save({filename:'envios-prueba-escala-'+new Date().toISOString().slice(0,10)+'.csv',data:csvRes(rows)}).catch(()=>{})}return}
 {const d=e.target.closest('[data-del]');if(d){RES.del=d.dataset.del;render();return}
  const dn=e.target.closest('[data-delno]');if(dn){RES.del=null;render();return}
  const dk=e.target.closest('[data-delok]');if(dk){const [u,id]=dk.dataset.delok.split('/');RES.del=null;DBX.doc('envios/'+u+'/items/'+id).delete().catch(()=>{});return}}
 const pb=e.target.closest('[data-p]');if(pb){const q=pb.dataset.p,m=byK[ES.k];ES.v={};[...ES.skip].forEach(s=>{if(s.startsWith(ES.k+':'))ES.skip.delete(s)});if(q!=='clr')m.crit.forEach(c=>ES.skip.add(ES.k+':'+c.id));if(q!=='clr')m.crit.forEach(c=>c.gs.forEach((z,i)=>{if(z.sc)ES.v[c.id+'.'+i]=[q==='OK'?(z.sc==='RT'?'OK':'B'):(q==='B'?(z.sc==='S5'?'B':'OK'):q)]}));render();return}
 const gt=e.target.closest('[data-go]');if(gt){cur=gt.dataset.go;try{history.replaceState(null,'','#'+cur)}catch(_){}render();window.scrollTo(0,0);return}
 const sk=e.target.closest('[data-skip]');if(sk){ES.skip.add(ES.k+':'+sk.dataset.skip);render();return}
 const mk=e.target.closest('[data-mk]');if(mk){goMan(mk.dataset.mk);render();return}
 const p=e.target.closest('.pill');if(p){if(p.dataset.c)TAB.crit=p.dataset.c;render()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.rid){if(d.open)RES.open.add(d.dataset.rid);else RES.open.delete(d.dataset.rid)}},true);
document.addEventListener('input',e=>{if(e.target&&e.target.id==='com')ES.com=e.target.value});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='nsug'){ES.nota=e.target.value;render()}});
{const h=(location.hash||'').slice(1);if(['ini','esc','sim','bas'].includes(h))cur=h}
render();
